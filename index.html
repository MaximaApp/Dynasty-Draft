<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Dynasty Builder and Simulator</title>
<style>
:root {
--bg: #0f172a;
--card-bg: #1e293b;
--text: #f8fafc;
--text-muted: #94a3b8;
--accent: #3b82f6;
--accent-glow: rgba(59, 130, 246, 0.5);
--success: #22c55e;
--transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
--border: rgba(255, 255, 255, 0.1);
}

```
    [data-theme="light"] {
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #2563eb;
        --accent-glow: rgba(37, 99, 235, 0.2);
        --border: rgba(0, 0, 0, 0.05);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        transition: background-color 0.5s ease;
        min-height: 100vh;
        padding-bottom: 50px;
        overflow-x: hidden;
    }

    /* --- UI Components --- */
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }

    header {
        padding: 40px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo-area h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(to right, var(--accent), #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .controls {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .btn {
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
    }

    .btn-primary {
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--accent-glow);
    }

    .btn-secondary {
        background: var(--card-bg);
        color: var(--text);
        border: 1px solid var(--border);
    }

    .btn-secondary:hover {
        background: var(--border);
    }

    /* --- Generator Section --- */
    .generator-box {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 60px;
        text-align: center;
        border: 1px solid var(--border);
        margin-bottom: 40px;
        position: relative;
        overflow: hidden;
    }

    .slot-display {
        height: 200px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
    }

    .team-logo-large {
        width: 180px;
        height: 180px;
        object-fit: contain;
        transition: var(--transition);
        filter: drop-shadow(0 0 0px transparent);
    }

    .team-logo-large.selected {
        animation: teamPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        filter: drop-shadow(0 0 20px var(--accent));
    }

    .team-name-display {
        font-size: 2.5rem;
        font-weight: 800;
        margin-top: 20px;
        min-height: 3.5rem;
    }

    /* --- Mode Grid --- */
    .app-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 30px;
    }

    .app-grid.mode-1v1 {
        grid-template-columns: 1fr 1fr;
    }

    .builder-column {
        background: var(--card-bg);
        border-radius: 24px;
        padding: 30px;
        border: 1px solid var(--border);
    }

    .section-title {
        font-size: 1.2rem;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    /* --- Roster Cards --- */
    .roster-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
    }

    .pos-card {
        background: var(--bg);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        text-align: center;
        transition: var(--transition);
        cursor: pointer;
        position: relative;
    }

    .pos-card:hover {
        transform: translateY(-5px);
        border-color: var(--accent);
    }

    .pos-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .pos-value {
        font-weight: 700;
        font-size: 1rem;
    }

    .pos-rating {
        font-size: 0.8rem;
        color: var(--success);
        margin-top: 5px;
    }

    /* --- Win Simulation --- */
    .sim-overlay {
        margin-top: 40px;
        text-align: center;
    }

    .prob-card {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 24px;
        border: 1px solid var(--border);
        display: inline-block;
        min-width: 300px;
    }

    .progress-container {
        width: 100%;
        height: 12px;
        background: var(--bg);
        border-radius: 10px;
        margin: 20px 0;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* --- Animations --- */
    @keyframes teamPop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes confetti {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        background: var(--accent);
        top: -10px;
        z-index: 999;
        pointer-events: none;
    }

    /* --- Toggle Switch --- */
    .switch-group {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: var(--border);
        transition: .4s;
        border-radius: 20px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
        .app-grid.mode-1v1 { grid-template-columns: 1fr; }
        .generator-box { padding: 30px; }
        .team-name-display { font-size: 1.8rem; }
    }
</style>

```
<div class="container">
    <header>
        <div class="logo-area">
            <h1>NFL DYNASTY</h1>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" onclick="toggleMode()" id="modeToggle">
                <span>👥</span> 1v1 Mode
            </button>
            <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">
                <span>🌙</span>
            </button>
        </div>
    </header>

    <section class="generator-section">
        <div class="generator-box">
            <div class="slot-display" id="slotMachine">
                <img src="[https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png](https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png)" alt="NFL" class="team-logo-large" id="mainLogo">
                <div class="team-name-display" id="mainTeamName">Select Your Fate</div>
            </div>
            <button class="btn btn-primary" style="margin: 0 auto; padding: 16px 40px; font-size: 1.1rem;" onclick="generateTeam()" id="genBtn">
                GENERATE TEAM
            </button>
            
            <div style="margin-top: 25px; display: flex; justify-content: center; gap: 20px;">
                <div class="switch-group">
                    <label class="switch">
                        <input type="checkbox" id="coachToggle" onchange="refreshRosters()">
                        <span class="slider"></span>
                    </label>
                    <span>Add Coach</span>
                </div>
                <div class="switch-group">
                    <label class="switch">
                        <input type="checkbox" id="olineToggle" onchange="refreshRosters()">
                        <span class="slider"></span>
                    </label>
                    <span>Add O-Line</span>
                </div>
            </div>
        </div>
    </section>

    <main class="app-grid" id="mainGrid">
        <div class="builder-column" id="p1Column">
            <div class="section-title">
                <span id="p1Title">YOUR ROSTER</span>
                <span id="p1Power" style="color: var(--accent); font-weight: 800;">OVR: --</span>
            </div>
            <div class="roster-grid" id="p1Roster">
                </div>
        </div>

        <div class="builder-column hidden" id="p2Column">
            <div class="section-title">
                <span>PLAYER 2 ROSTER</span>
                <span id="p2Power" style="color: var(--accent); font-weight: 800;">OVR: --</span>
            </div>
            <div class="roster-grid" id="p2Roster">
                </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="generateTeam(true)">
                GENERATE P2 TEAM
            </button>
        </div>
    </main>

    <section class="sim-overlay">
        <div class="prob-card">
            <h3 id="simStatus">Ready to Simulate?</h3>
            <div class="progress-container">
                <div class="progress-bar" id="winBar"></div>
            </div>
            <div id="simResult" style="font-weight: 700; font-size: 1.2rem; margin-bottom: 20px;">
                Hit simulate to see win probability
            </div>
            <button class="btn btn-primary" style="margin: 0 auto;" onclick="runSimulation()">
                RUN WIN ENGINE
            </button>
        </div>
    </section>
</div>

<script>
    const nflTeams = [
        { id: 'ari', name: 'Arizona Cardinals', color: '#97233F' },
        { id: 'atl', name: 'Atlanta Falcons', color: '#A71930' },
        { id: 'bal', name: 'Baltimore Ravens', color: '#241773' },
        { id: 'buf', name: 'Buffalo Bills', color: '#00338D' },
        { id: 'car', name: 'Carolina Panthers', color: '#0085CA' },
        { id: 'chi', name: 'Chicago Bears', color: '#0B162A' },
        { id: 'cin', name: 'Cincinnati Bengals', color: '#FB4F14' },
        { id: 'cle', name: 'Cleveland Browns', color: '#311D00' },
        { id: 'dal', name: 'Dallas Cowboys', color: '#003594' },
        { id: 'den', name: 'Denver Broncos', color: '#FB4F14' },
        { id: 'det', name: 'Detroit Lions', color: '#0076B6' },
        { id: 'gb',  name: 'Green Bay Packers', color: '#203731' },
        { id: 'hou', name: 'Houston Texans', color: '#03202F' },
        { id: 'ind', name: 'Indianapolis Colts', color: '#002C5F' },
        { id: 'jax', name: 'Jacksonville Jaguars', color: '#006778' },
        { id: 'kc',  name: 'Kansas City Chiefs', color: '#E31837' },
        { id: 'lv',  name: 'Las Vegas Raiders', color: '#000000' },
        { id: 'lac', name: 'Los Angeles Chargers', color: '#0080C6' },
        { id: 'lar', name: 'Los Angeles Rams', color: '#003594' },
        { id: 'mia', name: 'Miami Dolphins', color: '#008E97' },
        { id: 'min', name: 'Minnesota Vikings', color: '#4F2683' },
        { id: 'ne',  name: 'New England Patriots', color: '#002244' },
        { id: 'no',  name: 'New Orleans Saints', color: '#D3BC8D' },
        { id: 'nyg', name: 'New York Giants', color: '#0B2265' },
        { id: 'nyj', name: 'New York Jets', color: '#125740' },
        { id: 'phi', name: 'Philadelphia Eagles', color: '#004C54' },
        { id: 'pit', name: 'Pittsburgh Steelers', color: '#FFB612' },
        { id: 'sf',  name: 'San Francisco 49ers', color: '#AA0000' },
        { id: 'sea', name: 'Seattle Seahawks', color: '#002244' },
        { id: 'tb',  name: 'Tampa Bay Buccaneers', color: '#D50A0A' },
        { id: 'ten', name: 'Tennessee Titans', color: '#0C2340' },
        { id: 'was', name: 'Washington Commanders', color: '#773141' }
    ];

    let state = {
        mode: 'solo',
        theme: 'dark',
        p1: { team: null, roster: {} },
        p2: { team: null, roster: {} },
        isSpinning: false
    };

    const positions = ['QB', 'WR1', 'WR2', 'TE', 'RB', 'DEF'];

    // --- Core Functions ---

    function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', state.theme);
        document.getElementById('themeBtn').innerHTML = state.theme === 'dark' ? '<span>🌙</span>' : '<span>☀️</span>';
    }

    function toggleMode() {
        state.mode = state.mode === 'solo' ? '1v1' : 'solo';
        const grid = document.getElementById('mainGrid');
        const p2Col = document.getElementById('p2Column');
        const modeBtn = document.getElementById('modeToggle');

        if (state.mode === '1v1') {
            grid.classList.add('mode-1v1');
            p2Col.classList.remove('hidden');
            modeBtn.innerHTML = '<span>👤</span> Solo Mode';
            document.getElementById('p1Title').innerText = "PLAYER 1 ROSTER";
        } else {
            grid.classList.remove('mode-1v1');
            p2Col.classList.add('hidden');
            modeBtn.innerHTML = '<span>👥</span> 1v1 Mode';
            document.getElementById('p1Title').innerText = "YOUR ROSTER";
        }
    }

    function generateTeam(isP2 = false) {
        if (state.isSpinning) return;
        state.isSpinning = true;

        const logoImg = isP2 ? document.createElement('img') : document.getElementById('mainLogo');
        const nameDiv = isP2 ? document.createElement('div') : document.getElementById('mainTeamName');
        
        // Re-target for P2 if needed (for simplicity P2 just selects without full animation or we reuse main)
        const targetLogo = document.getElementById('mainLogo');
        const targetName = document.getElementById('mainTeamName');

        let iterations = 0;
        let maxIterations = 30;
        let currentDelay = 50;

        targetLogo.classList.remove('selected');

        const spin = () => {
            const randomTeam = nflTeams[Math.floor(Math.random() * nflTeams.length)];
            targetLogo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${randomTeam.id}.png`;
            targetName.innerText = randomTeam.name;
            targetName.style.color = randomTeam.color;

            iterations++;
            if (iterations < maxIterations) {
                currentDelay += iterations * 0.5;
                setTimeout(spin, currentDelay);
            } else {
                finalizeTeam(randomTeam, isP2);
            }
        };

        spin();
    }

    function finalizeTeam(team, isP2) {
        const player = isP2 ? 'p2' : 'p1';
        state[player].team = team;
        state.isSpinning = false;
        
        const targetLogo = document.getElementById('mainLogo');
        targetLogo.classList.add('selected');
        
        createConfetti();
        buildRoster(player);
    }

    function buildRoster(player) {
        const container = document.getElementById(`${player}Roster`);
        container.innerHTML = '';
        
        let currentPos = [...positions];
        if (document.getElementById('coachToggle').checked) currentPos.push('COACH');
        if (document.getElementById('olineToggle').checked) currentPos.push('O-LINE');

        let totalPower = 0;

        currentPos.forEach(pos => {
            const rating = Math.floor(Math.random() * (99 - 75 + 1)) + 75;
            state[player].roster[pos] = rating;
            totalPower += rating;

            const card = document.createElement('div');
            card.className = 'pos-card';
            card.innerHTML = `
                <div class="pos-label">${pos}</div>
                <div class="pos-value">STAR PLAYER</div>
                <div class="pos-rating">★ ${rating}</div>
            `;
            container.appendChild(card);
        });

        const avg = Math.round(totalPower / currentPos.length);
        document.getElementById(`${player}Power`).innerText = `OVR: ${avg}`;
        state[player].overall = avg;
    }

    function refreshRosters() {
        if (state.p1.team) buildRoster('p1');
        if (state.p2.team) buildRoster('p2');
    }

    function runSimulation() {
        if (!state.p1.team) return alert("Generate Player 1 Team first!");
        if (state.mode === '1v1' && !state.p2.team) return alert("Generate Player 2 Team first!");

        const bar = document.getElementById('winBar');
        const res = document.getElementById('simResult');
        const status = document.getElementById('simStatus');
        
        bar.style.width = '0%';
        status.innerText = "Analyzing matchups...";

        setTimeout(() => {
            let winProb;
            let winText;

            if (state.mode === 'solo') {
                // Against League Average (85)
                winProb = Math.min(Math.max(state.p1.overall - 85 + 50, 5), 95);
                const randomFactor = (Math.random() * 10) - 5;
                winProb = Math.round(winProb + randomFactor);
                winText = winProb > 50 ? `Victory Likely (${winProb}%)` : `Underdog Status (${winProb}%)`;
            } else {
                // P1 vs P2
                const diff = state.p1.overall - state.p2.overall;
                winProb = Math.min(Math.max(50 + (diff * 2), 5), 95);
                const randomFactor = (Math.random() * 10) - 5;
                winProb = Math.round(winProb + randomFactor);
                winText = winProb > 50 ? `P1 is Favored (${winProb}%)` : `P2 is Favored (${100 - winProb}%)`;
            }

            bar.style.width = `${winProb}%`;
            res.innerText = winText;
            status.innerText = "Simulation Complete";
            
            if (winProb > 50) createConfetti();
        }, 500);
    }

    function createConfetti() {
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = state.p1.team ? state.p1.team.color : 'var(--accent)';
            c.style.animation = `confetti ${Math.random() * 2 + 1}s linear forwards`;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    // Initialize empty state
    window.onload = () => {
        // Pre-warm UI
    };

</script>

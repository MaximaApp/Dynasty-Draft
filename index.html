<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynasty Draft | Official Madden 26</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0c0f14; --card: #161b22; --panel: #1c212c; --text: #f0f6fc;
            --text-dim: #8b949e; --accent: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.4);
            --border: #30363d; --glass: rgba(22, 27, 34, 0.8);
        }
        [data-theme="light"] {
            --bg: #f6f8fa; --card: #ffffff; --panel: #f1f5f9; --text: #1f2328;
            --text-dim: #636c76; --accent: #0969da; --accent-glow: rgba(9, 105, 218, 0.2);
            --border: #d0d7de; --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- Animations --- */
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 0 15px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }

        .screen { display: none; min-height: 100vh; padding: 20px; animation: pop 0.4s ease-out; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        /* --- Landing --- */
        #screen-landing { justify-content: center; text-align: center; }
        .hero-title { font-size: 4rem; font-weight: 900; letter-spacing: -3px; background: linear-gradient(to bottom, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }

        /* --- Main UI --- */
        .header-top { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-top h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .container { width: 100%; max-width: 900px; }
        .glass-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 28px; padding: 25px; margin-bottom: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }

        /* --- Shuffle Stage --- */
        .shuffle-box { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .logo-display { width: 120px; height: 120px; object-fit: contain; transition: transform 0.1s; }
        .logo-display.bounce { transform: scale(1.2); }

        /* --- Roster Grid --- */
        .roster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-top: 15px; }
        .slot { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 15px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
        .slot.highlight { border-color: var(--accent); animation: pulse 1.5s infinite; }
        .slot-ovr { font-weight: 900; color: var(--accent); font-size: 1.2rem; }
        .slot-img { width: 45px; height: 45px; opacity: 0.1; filter: grayscale(1); margin: 8px 0; transition: 0.3s; }
        .slot.filled .slot-img { opacity: 1; filter: grayscale(0); }
        .slot-pos { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); }

        /* --- Calculate/Record Section --- */
        .result-box { text-align: center; }
        #calc-res { font-size: 3rem; font-weight: 900; color: var(--accent); transition: 0.5s; }

        /* --- Navigation Bar --- */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 40px; display: flex; padding: 8px; gap: 5px; z-index: 1000; }
        .nav-btn { background: transparent; border: none; color: var(--text-dim); padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
        .nav-btn.active { background: var(--accent); color: white; }

        .btn-main { background: var(--accent); color: white; border: none; padding: 18px 36px; border-radius: 20px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px var(--accent-glow); }
        .btn-main:hover { transform: translateY(-3px); }
        .btn-main:active { transform: scale(0.95); }
        .hidden { display: none; }
        .fog-active .slot-ovr, .fog-active #calc-res { filter: blur(8px); }
    </style>
</head>
<body id="app-body">

    <div id="screen-landing" class="screen active">
        <h1 class="hero-title">DYNASTY</h1>
        <p style="color: var(--text-dim); margin-bottom: 40px; font-weight: 500;">Madden 26 Official Ratings Edition</p>
        <button class="btn-main" onclick="app.showScreen('draft')">PLAY NOW</button>
    </div>

    <div id="screen-draft" class="screen">
        <div class="header-top">
            <h1>Dynasty Draft</h1>
            <div id="global-status" style="font-size: 0.8rem; font-weight: 700;">PLAYER 1 TURN</div>
        </div>

        <div class="container">
            <div class="glass-card shuffle-box">
                <div id="team-name" style="font-weight: 800; opacity: 0.5; font-size: 0.9rem;">SELECT A POSITION BELOW</div>
                <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" class="logo-display" id="main-logo">
                <button class="btn-main" id="spin-btn" onclick="app.shuffle()">SPIN TEAM</button>
            </div>

            <div class="glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>PLAYER 1</h3>
                    <div id="p1-total" class="slot-ovr">OVR: --</div>
                </div>
                <div class="roster-grid" id="p1-grid"></div>
            </div>

            <div class="glass-card hidden" id="p2-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>PLAYER 2</h3>
                    <div id="p2-total" class="slot-ovr">OVR: --</div>
                </div>
                <div class="roster-grid" id="p2-grid"></div>
            </div>

            <div class="glass-card result-box">
                <div id="calc-res">--</div>
                <div id="calc-label" style="color: var(--text-dim); margin-bottom: 20px;">Projected Win %</div>
                <button class="btn-main" style="background: #22c55e; width: 100%;" onclick="app.calculate()">SIMULATE SEASON</button>
            </div>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="container">
            <div class="glass-card">
                <h2 style="margin-bottom: 20px;">Modern UI Settings</h2>
                <div style="display:flex; flex-direction:column; gap:15px;">
                    <label style="display:flex; justify-content:space-between;">1v1 Duel Mode <input type="checkbox" id="set-1v1" onchange="app.toggle1v1()"></label>
                    <hr style="border:0; border-top:1px solid var(--border);">
                    <label style="display:flex; justify-content:space-between;">Hide Ratings (Fog) <input type="checkbox" id="set-fog" onchange="app.toggleFog()"></label>
                    <label style="display:flex; justify-content:space-between;">Light Mode <input type="checkbox" id="set-theme" onchange="app.toggleTheme()"></label>
                </div>
                <button class="btn-main" style="background: #ef4444; width: 100%; margin-top: 30px;" onclick="location.reload()">WIPE DATA</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="app.showScreen('draft', this)">DRAFT</button>
        <button class="nav-btn" onclick="app.showScreen('settings', this)">SETTINGS</button>
    </nav>

    <script>
        // OFFICIAL MADDEN 26 RATINGS
        const TEAMS = [
            { id: 'cin', n: 'Bengals', qb: 97, rb: 84, wr: 99, te: 82, def: 85 }, // Ja'Marr Chase 99
            { id: 'phi', n: 'Eagles', qb: 88, rb: 99, wr: 93, te: 88, def: 88 }, // Saquon 99, Lane Johnson 99
            { id: 'buf', n: 'Bills', qb: 99, rb: 87, wr: 82, te: 86, def: 88 }, // Josh Allen 99 (MVP)
            { id: 'bal', n: 'Ravens', qb: 99, rb: 98, wr: 87, te: 91, def: 94 }, // Lamar 99
            { id: 'min', n: 'Vikings', qb: 79, rb: 85, wr: 99, te: 89, def: 85 }, // JJ 99
            { id: 'cle', n: 'Browns', qb: 76, rb: 91, wr: 88, te: 89, def: 99 }, // Myles Garrett 99
            { id: 'kc', n: 'Chiefs', qb: 95, rb: 86, wr: 88, te: 93, def: 96 },
            { id: 'sf', n: '49ers', qb: 88, rb: 94, wr: 92, te: 98, def: 95 },
            { id: 'det', n: 'Lions', qb: 85, rb: 95, wr: 96, te: 91, def: 87 },
            { id: 'dal', n: 'Cowboys', qb: 90, rb: 79, wr: 95, te: 85, def: 98 }
        ];

        const app = {
            state: { turn: 1, is1v1: false, spinning: false, pick: null, rosters: { 1: {}, 2: {} } },

            init() {
                this.renderGrid(1);
                this.renderGrid(2);
            },

            showScreen(id, btn) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('screen-' + id).classList.add('active');
                if(btn) {
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            },

            renderGrid(p) {
                const grid = document.getElementById(`p${p}-grid`);
                grid.innerHTML = '';
                ['QB', 'RB', 'WR', 'TE', 'DEF'].forEach(pos => {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.id = `slot-${p}-${pos}`;
                    slot.innerHTML = `
                        <div class="slot-pos">${pos}</div>
                        <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" class="slot-img" id="img-${p}-${pos}">
                        <div class="slot-ovr" id="ovr-${p}-${pos}">--</div>
                    `;
                    slot.onclick = () => this.assign(p, pos);
                    grid.appendChild(slot);
                });
            },

            shuffle() {
                if(this.state.spinning || this.state.pick) return;
                this.state.spinning = true;
                const img = document.getElementById('main-logo');
                const name = document.getElementById('team-name');
                
                let speed = 50;
                let frames = 0;
                
                const cycle = () => {
                    const t = TEAMS[Math.floor(Math.random() * TEAMS.length)];
                    img.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
                    name.innerText = t.n.toUpperCase();
                    frames++;
                    
                    if (frames < 30) {
                        setTimeout(cycle, speed);
                        if(frames > 20) speed += 30; // Slow down
                    } else {
                        this.state.pick = t;
                        this.state.spinning = false;
                        img.classList.add('bounce');
                        setTimeout(() => img.classList.remove('bounce'), 300);
                        this.highlight();
                    }
                };
                cycle();
            },

            highlight() {
                const p = this.state.turn;
                ['QB', 'RB', 'WR', 'TE', 'DEF'].forEach(pos => {
                    if(!this.state.rosters[p][pos]) document.getElementById(`slot-${p}-${pos}`).classList.add('highlight');
                });
            },

            assign(p, pos) {
                if(!this.state.pick || p !== this.state.turn || this.state.rosters[p][pos]) return;
                
                const t = this.state.pick;
                const ratings = { QB: t.qb, RB: t.rb, WR: t.wr, TE: t.te, DEF: t.def };
                this.state.rosters[p][pos] = ratings[pos];
                
                const slot = document.getElementById(`slot-${p}-${pos}`);
                slot.classList.add('filled');
                slot.classList.remove('highlight');
                document.getElementById(`img-${p}-${pos}`).src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
                document.getElementById(`ovr-${p}-${pos}`).innerText = ratings[pos];
                
                this.state.pick = null;
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('highlight'));
                this.calcTotal(p);

                if(this.state.is1v1) {
                    this.state.turn = (this.state.turn === 1 ? 2 : 1);
                    document.getElementById('global-status').innerText = `PLAYER ${this.state.turn} TURN`;
                }
            },

            calcTotal(p) {
                const vals = Object.values(this.state.rosters[p]);
                const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0) / 5) : 0;
                document.getElementById(`p${p}-total`).innerText = `OVR: ${avg}`;
                this.state.rosters[p].avg = avg;
            },

            calculate() {
                const r1 = this.state.rosters[1].avg || 0;
                if(!r1) return;

                if(this.state.is1v1) {
                    const r2 = this.state.rosters[2].avg || 0;
                    const diff = r1 - r2;
                    const prob = Math.min(99, Math.max(1, 50 + (diff * 4)));
                    document.getElementById('calc-res').innerText = `Player 1 Wins by ${prob}%!`;
                    if(prob > 50) this.celebrate();
                } else {
                    const record = Math.round((r1 - 70) / 1.7);
                    document.getElementById('calc-res').innerText = `${Math.min(17, record)}-${17 - record}`;
                    this.celebrate();
                }
            },

            celebrate() {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#3b82f6', '#ffffff', '#ffd700'] });
            },

            toggle1v1() {
                this.state.is1v1 = document.getElementById('set-1v1').checked;
                document.getElementById('p2-card').classList.toggle('hidden', !this.state.is1v1);
            },
            toggleFog() { document.getElementById('app-body').classList.toggle('fog-active'); },
            toggleTheme() { document.documentElement.setAttribute('data-theme', document.getElementById('set-theme').checked ? 'light' : 'dark'); }
        };

        app.init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DYNASTY DRAFT 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: rgba(255, 255, 255, 0.05);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.6);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --radius: 28px;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card: rgba(0, 0, 0, 0.04);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --text: #0f172a;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            transition: background 0.3s ease;
        }

        /* --- INTRO --- */
        #intro {
            position: fixed; inset: 0; z-index: 2000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .intro-title { 
            font-size: 4rem; font-weight: 800; text-align: center; margin-bottom: 2rem;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px var(--accent-glow));
        }

        /* --- APP STRUCTURE --- */
        #app { height: 100%; display: flex; flex-direction: column; }
        .app-header { padding: 30px 20px 10px; text-align: left; }
        .app-header h1 { font-size: 1.8rem; font-weight: 800; margin: 0; color: var(--text); }
        .app-header p { font-size: 0.75rem; color: var(--text-dim); margin: 4px 0 0; font-weight: 600; }

        .view-container { flex: 1; overflow-y: auto; padding-bottom: 20px; }

        /* --- SPIN SECTION --- */
        .spin-section { padding: 10px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .logo-ring {
            width: 140px; height: 140px; border-radius: 50%;
            background: var(--card); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: transform 0.3s;
        }
        .logo-ring img { width: 70%; height: 70%; object-fit: contain; }
        .team-label { font-size: 1.6rem; font-weight: 800; text-shadow: 0 0 10px var(--accent-glow); }

        /* --- BOARD --- */
        .board-container { padding: 0 20px; margin-top: 15px; }
        .player-tag { font-weight: 800; color: var(--accent); margin-bottom: 8px; display: block; font-size: 0.7rem; letter-spacing: 1px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .slot {
            background: var(--card); border-radius: 20px; padding: 18px 5px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .slot.active-turn { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: scale(1.02); }
        .slot.filled { background: rgba(99, 102, 241, 0.12); border-color: var(--accent); animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(0.9); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .slot-pos { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); margin-bottom: 4px; }
        .slot-ovr { font-size: 1.4rem; font-weight: 800; transition: 0.4s; }
        .blur-ovr { filter: blur(10px); opacity: 0.2; }

        /* --- RESULTS --- */
        #result-text { 
            font-weight: 800; text-align: center; margin-top: 15px; 
            min-height: 50px; line-height: 1.2;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- NAV --- */
        .nav-bar { height: 75px; background: var(--bg); display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.75rem; color: var(--text-dim); cursor: pointer; }
        .nav-item.active { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }

        /* --- BUTTONS --- */
        .primary-btn {
            background: var(--accent); color: #fff; border: none; padding: 16px 40px;
            border-radius: 40px; font-weight: 800; font-size: 1rem;
            box-shadow: 0 10px 25px var(--accent-glow); cursor: pointer; transition: 0.3s;
        }
        .primary-btn:active { transform: scale(0.94); }
        .reset-btn { background: none; border: 1px solid var(--text-dim); color: var(--text-dim); padding: 8px 20px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; cursor: pointer; opacity: 0.6; }

        /* --- MODAL --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 3000; display: none; align-items: flex-end; }
        .modal.show { display: flex; }
        .modal-sheet { background: var(--bg); width: 100%; border-radius: 30px 30px 0 0; padding: 30px 20px 50px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
        .modal.show .modal-sheet { transform: translateY(0); }
        .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        /* --- SETTINGS --- */
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <div id="intro">
        <h1 class="intro-title">DYNASTY<br>DRAFT</h1>
        <button class="primary-btn" onclick="enterApp()">PLAY</button>
    </div>

    <div id="app">
        <header class="app-header">
            <h1>Dynasty Draft</h1>
            <p>Build Your Own 17-0 NFL Team</p>
        </header>

        <div id="view-draft" class="view-container">
            <div class="spin-section">
                <div class="logo-ring" id="logo-ring">
                    <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="spin-logo">
                </div>
                <div class="team-label" id="spin-label">READY?</div>
                <button class="primary-btn" id="spin-btn" onclick="startSpin()">SPIN TEAM</button>
                <button class="reset-btn" onclick="resetAll()">RESET GAME</button>
                <div id="result-text"></div>
            </div>

            <div class="board-container">
                <span class="player-tag" id="p1-tag">YOUR ROSTER</span>
                <div class="board" id="board-p1"></div>
            </div>

            <div class="board-container" id="container-p2" style="display: none;">
                <span class="player-tag">PLAYER 2 ROSTER</span>
                <div class="board" id="board-p2"></div>
            </div>
        </div>

        <div id="view-settings" class="view-container" style="display: none; padding: 20px;">
            <h2 style="font-weight: 800; font-size: 2rem; margin-bottom: 20px;">Settings</h2>
            <div class="settings-row">
                <span>Light Mode</span>
                <label class="switch"><input type="checkbox" id="check-theme" onchange="updateSettings()"><span class="slider"></span></label>
            </div>
            <div class="settings-row">
                <span>1v1 Battle Mode</span>
                <label class="switch"><input type="checkbox" id="check-1v1" onchange="updateSettings()"><span class="slider"></span></label>
            </div>
            <div class="settings-row">
                <span>Hide Overalls</span>
                <label class="switch"><input type="checkbox" id="check-hide" checked onchange="updateSettings()"><span class="slider"></span></label>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active" id="nav-draft" onclick="switchView('draft')">DRAFT</div>
            <div class="nav-item" id="nav-settings" onclick="switchView('settings')">SETTINGS</div>
        </nav>
    </div>

    <div class="modal" id="draft-modal">
        <div class="modal-sheet">
            <h3 style="text-align:center; font-weight:800; margin-bottom:20px;">DRAFT POSITION</h3>
            <div class="choice-grid" id="choice-grid"></div>
        </div>
    </div>

<script>
    const teams = [
        { name: 'Cardinals', id: 'ari' }, { name: 'Falcons', id: 'atl' }, { name: 'Ravens', id: 'bal' },
        { name: 'Bills', id: 'buf' }, { name: 'Panthers', id: 'car' }, { name: 'Bears', id: 'chi' },
        { name: 'Bengals', id: 'cin' }, { name: 'Browns', id: 'cle' }, { name: 'Cowboys', id: 'dal' },
        { name: 'Broncos', id: 'den' }, { name: 'Lions', id: 'det' }, { name: 'Packers', id: 'gb' },
        { name: 'Texans', id: 'hou' }, { name: 'Colts', id: 'ind' }, { name: 'Jaguars', id: 'jax' },
        { name: 'Chiefs', id: 'kc' }, { name: 'Raiders', id: 'lv' }, { name: 'Chargers', id: 'lac' },
        { name: 'Rams', id: 'lar' }, { name: 'Dolphins', id: 'mia' }, { name: 'Vikings', id: 'min' },
        { name: 'Patriots', id: 'ne' }, { name: 'Saints', id: 'no' }, { name: 'Giants', id: 'nyg' },
        { name: 'Jets', id: 'nyj' }, { name: 'Eagles', id: 'phi' }, { name: 'Steelers', id: 'pit' },
        { name: '49ers', id: 'sf' }, { name: 'Seahawks', id: 'sea' }, { name: 'Buccaneers', id: 'tb' },
        { name: 'Titans', id: 'ten' }, { name: 'Commanders', id: 'was' }
    ];

    const positions = ['QB', 'RB', 'WR', 'WR', 'TE', 'DEF'];
    let state = {
        p1: Array(6).fill(null),
        p2: Array(6).fill(null),
        currentPlayer: 1,
        is1v1: false,
        hideOvr: true,
        isSpinning: false,
        gameOver: false
    };

    // Initialize Theme
    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('check-theme').checked = true;
    }

    function enterApp() {
        document.getElementById('intro').style.transform = 'translateY(-100%)';
        renderBoard('p1');
        renderBoard('p2');
    }

    function updateSettings() {
        state.is1v1 = document.getElementById('check-1v1').checked;
        state.hideOvr = document.getElementById('check-hide').checked;
        const isLight = document.getElementById('check-theme').checked;
        
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');

        document.getElementById('container-p2').style.display = state.is1v1 ? 'block' : 'none';
        document.getElementById('p1-tag').innerText = state.is1v1 ? 'PLAYER 1 ROSTER' : 'YOUR ROSTER';
        
        renderBoard('p1');
        renderBoard('p2');
    }

    function renderBoard(playerKey) {
        const board = document.getElementById(`board-${playerKey}`);
        board.innerHTML = '';
        const data = state[playerKey];

        data.forEach((player, i) => {
            const div = document.createElement('div');
            div.className = `slot ${player ? 'filled' : ''}`;
            if(state.is1v1 && !state.gameOver && state.currentPlayer === (playerKey === 'p1' ? 1 : 2)) {
                div.classList.add('active-turn');
            }
            const blur = (state.hideOvr && !state.gameOver && player) ? 'blur-ovr' : '';
            div.innerHTML = `<div class="slot-pos">${positions[i]}</div><div class="slot-ovr ${blur}">${player ? player.ovr : '-'}</div>`;
            board.appendChild(div);
        });
        checkWinCondition();
    }

    function startSpin() {
        if(state.isSpinning || state.gameOver) return;
        state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        let velocity = 40;
        let decel = 1.08;
        let spins = 0;
        let maxSpins = 20 + Math.floor(Math.random() * 10);

        function tick() {
            spins++;
            const randomTeam = teams[Math.floor(Math.random() * teams.length)];
            document.getElementById('spin-logo').src = `https://a.espncdn.com/i/teamlogos/nfl/500/${randomTeam.id}.png`;
            document.getElementById('spin-label').innerText = randomTeam.name.toUpperCase();
            velocity *= decel;

            if (spins >= maxSpins) {
                state.isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                setTimeout(() => openDraft(randomTeam), 400);
            } else {
                setTimeout(tick, velocity);
            }
        }
        tick();
    }

    function openDraft(team) {
        const modal = document.getElementById('draft-modal');
        const grid = document.getElementById('choice-grid');
        grid.innerHTML = '';
        const activeRoster = state.currentPlayer === 1 ? state.p1 : state.p2;

        positions.forEach((pos, i) => {
            if(!activeRoster[i]) {
                const btn = document.createElement('div');
                btn.className = 'slot filled';
                btn.innerHTML = `<div class="slot-pos">PICK</div><div class="slot-ovr" style="font-size:1rem">${pos}</div>`;
                btn.onclick = () => {
                    activeRoster[i] = { ovr: 78 + Math.floor(Math.random() * 21) };
                    if(state.is1v1) state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
                    modal.classList.remove('show');
                    renderBoard('p1');
                    renderBoard('p2');
                };
                grid.appendChild(btn);
            }
        });
        modal.classList.add('show');
    }

    function checkWinCondition() {
        const p1Full = state.p1.every(p => p !== null);
        const p2Full = state.p2.every(p => p !== null);
        if(state.is1v1) { if(p1Full && p2Full) finalize(); } else { if(p1Full) finalize(); }
    }

    function finalize() {
        state.gameOver = true;
        document.getElementById('spin-btn').style.display = 'none';
        const p1Sum = state.p1.reduce((s, p) => s + p.ovr, 0);
        const resEl = document.getElementById('result-text');

        if(state.is1v1) {
            const p2Sum = state.p2.reduce((s, p) => s + p.ovr, 0);
            const prob = (Math.exp(0.12 * p1Sum) / (Math.exp(0.12 * p1Sum) + Math.exp(0.12 * p2Sum))) * 100;
            const p1Wins = prob > 50;
            resEl.innerHTML = `<span style="color:var(--accent)">WIN PROBABILITY: ${p1Wins ? prob.toFixed(1) : (100-prob).toFixed(1)}%</span><br>${p1Wins ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS'}`;
        } else {
            const avg = p1Sum / 6;
            const winChance = Math.pow((avg - 75) / 25, 2);
            const wins = Math.min(17, Math.max(0, Math.floor(winChance * 17 + (Math.random() * 2))));
            const pct = ((wins / 17) * 100).toFixed(1);
            resEl.innerHTML = `<span style="font-size:1.5rem">RECORD: ${wins}-17</span><br><span style="color:var(--accent)">WIN PERCENTAGE: ${pct}%</span>`;
        }
        
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#6366f1', '#ffffff'] });
        renderBoard('p1');
        renderBoard('p2');
    }

    function switchView(view) {
        document.getElementById('view-draft').style.display = view === 'draft' ? 'block' : 'none';
        document.getElementById('view-settings').style.display = view === 'settings' ? 'block' : 'none';
        document.getElementById('nav-draft').classList.toggle('active', view === 'draft');
        document.getElementById('nav-settings').classList.toggle('active', view === 'settings');
    }

    function resetAll() {
        state.p1 = Array(6).fill(null);
        state.p2 = Array(6).fill(null);
        state.currentPlayer = 1;
        state.gameOver = false;
        document.getElementById('spin-btn').style.display = 'block';
        document.getElementById('spin-label').innerText = 'READY?';
        document.getElementById('result-text').innerHTML = '';
        renderBoard('p1');
        renderBoard('p2');
        switchView('draft');
    }
</script>
</body>
</html>

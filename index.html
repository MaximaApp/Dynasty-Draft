<style>
:root {
--bg: #0b0e14;
--card: #151921;
--panel: #1c212c;
--text: #f0f3f8;
--text-dim: #94a3b8;
--accent: #3b82f6;
--accent-glow: rgba(59, 130, 246, 0.4);
--border: rgba(255, 255, 255, 0.08);
--shadow: 0 12px 40px rgba(0,0,0,0.6);
--ease: cubic-bezier(0.4, 0, 0.2, 1);
}

```
    [data-theme="light"] {
        --bg: #f8fafc;
        --card: #ffffff;
        --panel: #f1f5f9;
        --text: #0f172a;
        --text-dim: #64748b;
        --accent: #2563eb;
        --accent-glow: rgba(37, 99, 235, 0.2);
        --border: rgba(0, 0, 0, 0.05);
        --shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; transition: background-color 0.5s var(--ease), border-color 0.5s var(--ease), color 0.5s var(--ease); }

    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; -webkit-tap-highlight-color: transparent; }

    /* --- Landing Screen --- */
    #landing-page {
        position: fixed; inset: 0; background: radial-gradient(circle at center, var(--panel), var(--bg));
        z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1);
    }
    #landing-page.hidden { transform: translateY(-100%); }
    .hero-title { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; background: linear-gradient(135deg, var(--text) 30%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* --- Main UI --- */
    .container { max-width: 1000px; margin: 0 auto; padding: 20px 20px 80px 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 20px; }
    .logo-text { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; opacity: 0.9; }

    .gear-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
    .gear-btn:hover { transform: rotate(45deg); border-color: var(--accent); }

    /* --- Draft Zone --- */
    .draft-card { 
        background: var(--card); border-radius: 32px; padding: 40px; border: 1px solid var(--border); 
        box-shadow: var(--shadow); text-align: center; margin-bottom: 40px;
        position: relative; overflow: hidden;
    }
    .draft-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%); opacity: 0.3; pointer-events: none; }

    .logo-display { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    #main-logo { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 0 20px transparent); transition: 0.3s; }
    #main-logo.glow { filter: drop-shadow(0 0 30px var(--accent-glow)); transform: scale(1.1); }

    .team-name-text { font-size: 2.2rem; font-weight: 800; height: 3rem; margin-bottom: 10px; }
    .btn { padding: 16px 32px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s var(--ease); font-size: 1rem; }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 8px 20px var(--accent-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px var(--accent-glow); filter: brightness(1.1); }
    .btn-primary:active { transform: scale(0.96); }

    /* --- Roster Grids --- */
    .game-grid { display: flex; flex-direction: column; gap: 30px; }
    @media (min-width: 800px) { .game-grid.dual { flex-direction: row; } .game-grid.dual > .roster-panel { flex: 1; } }

    .roster-panel { background: var(--card); border-radius: 28px; padding: 25px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .ovr-badge { font-weight: 900; color: var(--accent); font-size: 1.2rem; text-shadow: 0 0 10px var(--accent-glow); }

    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .slot { 
        background: var(--panel); border-radius: 20px; padding: 15px; text-align: center;
        border: 2px solid transparent; cursor: pointer; min-height: 140px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .slot.available { border: 2px dashed var(--accent); animation: pulseBorder 2s infinite; }
    .slot.filled { border-color: var(--border); background: var(--card); }
    .slot:hover { transform: translateY(-4px); }

    .slot-tag { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
    .slot-img { width: 50px; height: 50px; object-fit: contain; opacity: 0.1; transition: 0.5s; }
    .slot-img.active { opacity: 1; filter: drop-shadow(0 0 10px var(--accent-glow)); }
    .slot-name { font-size: 0.75rem; font-weight: 700; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

    /* --- Engine & Hall of Fame --- */
    .sim-section { margin-top: 50px; text-align: center; }
    .result-card { background: var(--card); border-radius: 30px; padding: 40px; display: inline-block; min-width: 320px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .record-display { font-size: 4rem; font-weight: 900; line-height: 1; margin: 15px 0; color: var(--accent); }

    .hof-section { margin-top: 60px; }
    .hof-title { font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .hof-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
    .hof-card { background: var(--card); padding: 15px; border-radius: 18px; border: 1px solid var(--border); min-width: 140px; text-align: center; flex-shrink: 0; }

    /* --- Modals --- */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--card); border-radius: 28px; padding: 35px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .toggle { width: 45px; height: 24px; background: var(--panel); border-radius: 20px; position: relative; cursor: pointer; border: 1px solid var(--border); }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: var(--text-dim); border-radius: 50%; transition: 0.3s; }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { left: 23px; background: white; }

    @keyframes pulseBorder { 0% { border-color: transparent; } 50% { border-color: var(--accent); } 100% { border-color: transparent; } }
    .hidden { display: none !important; }
    .blur { filter: blur(6px); }
</style>

<div class="container">

        <button class="gear-btn" onclick="ui.openSettings()">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

    <section class="draft-card">

                <span style="font-weight: 800; opacity: 0.7;">P1 FRANCHISE</span>
                <span class="ovr-badge" id="p1-ovr">--</span>
            </div>
            <div class="slots-grid" id="p1-slots"></div>
        </div>

        <div class="roster-panel hidden" id="p2-panel">

</div>

<script>
    const teams = [
        { id: 'bal', name: 'Ravens', ovr: 91, m: 95, c: 88 }, { id: 'kc',  name: 'Chiefs', ovr: 94, m: 98, c: 92 },
        { id: 'det', name: 'Lions', ovr: 92, m: 94, c: 85 }, { id: 'sf',  name: '49ers', ovr: 93, m: 90, c: 89 },
        { id: 'phi', name: 'Eagles', ovr: 90, m: 88, c: 80 }, { id: 'buf', name: 'Bills', ovr: 89, m: 85, c: 82 },
        { id: 'hou', name: 'Texans', ovr: 87, m: 92, c: 84 }, { id: 'dal', name: 'Cowboys', ovr: 87, m: 80, c: 75 },
        { id: 'gb',  name: 'Packers', ovr: 85, m: 90, c: 88 }, { id: 'nyj', name: 'Jets', ovr: 84, m: 78, c: 70 },
        { id: 'chi', name: 'Bears', ovr: 83, m: 85, c: 75 }, { id: 'ari', name: 'Cardinals', ovr: 77, m: 80, c: 70 },
        { id: 'atl', name: 'Falcons', ovr: 81, m: 82, c: 78 }, { id: 'car', name: 'Panthers', ovr: 72, m: 65, c: 60 },
        { id: 'cle', name: 'Browns', ovr: 84, m: 80, c: 85 }, { id: 'den', name: 'Broncos', ovr: 79, m: 75, c: 72 },
        { id: 'ind', name: 'Colts', ovr: 81, m: 85, c: 80 }, { id: 'jax', name: 'Jaguars', ovr: 80, m: 78, c: 72 },
        { id: 'lv',  name: 'Raiders', ovr: 78, m: 75, c: 70 }, { id: 'lac', name: 'Chargers', ovr: 84, m: 80, c: 82 },
        { id: 'lar', name: 'Rams', ovr: 86, m: 88, c: 80 }, { id: 'mia', name: 'Dolphins', ovr: 85, m: 82, c: 75 },
        { id: 'min', name: 'Vikings', ovr: 84, m: 88, c: 82 }, { id: 'ne',  name: 'Patriots', ovr: 74, m: 70, c: 85 },
        { id: 'no',  name: 'Saints', ovr: 78, m: 75, c: 70 }, { id: 'nyg', name: 'Giants', ovr: 75, m: 72, c: 68 },
        { id: 'pit', name: 'Steelers', ovr: 85, m: 90, c: 92 }, { id: 'sea', name: 'Seahawks', ovr: 81, m: 80, c: 78 },
        { id: 'tb',  name: 'Buccaneers', ovr: 83, m: 85, c: 80 }, { id: 'ten', name: 'Titans', ovr: 76, m: 70, c: 72 },
        { id: 'was', name: 'Commanders', ovr: 82, m: 85, c: 75 }, { id: 'cin', name: 'Bengals', ovr: 88, m: 85, c: 80 }
    ];

    const slots = ['QB', 'RB', 'WR1', 'WR2', 'TE', 'DEF'];

    let state = {
        theme: localStorage.getItem('dynasty_theme') || 'dark',
        mode: 'solo',
        currentPlayer: 1,
        isSpinning: false,
        currentTeam: null,
        fog: false,
        rosters: { 1: {}, 2: {} }
    };

    const ui = {
        init() {
            document.documentElement.setAttribute('data-theme', state.theme);
            this.updateToggles();
            this.renderSlots();
            this.updateHOF();
        },
        openSettings() { document.getElementById('settings-modal').style.display = 'flex'; },
        closeSettings() { document.getElementById('settings-modal').style.display = 'none'; },
        updateToggles() {
            document.getElementById('theme-toggle').className = `toggle ${state.theme === 'light' ? 'on' : ''}`;
            document.getElementById('fog-toggle').className = `toggle ${state.fog ? 'on' : ''}`;
            document.getElementById('mode-toggle').className = `toggle ${state.mode === '1v1' ? 'on' : ''}`;
        },
        toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('dynasty_theme', state.theme);
            document.documentElement.setAttribute('data-theme', state.theme);
            this.updateToggles();
        },
        toggleFog() {
            state.fog = !state.fog;
            document.getElementById('main-grid').classList.toggle('blur', state.fog);
            this.updateToggles();
        },
        toggleMode() {
            state.mode = state.mode === 'solo' ? '1v1' : 'solo';
            document.getElementById('p2-panel').classList.toggle('hidden', state.mode === 'solo');
            document.getElementById('main-grid').classList.toggle('dual', state.mode === '1v1');
            this.updateToggles();
            draft.reset();
        },
        renderSlots() {
            [1, 2].forEach(p => {
                const cont = document.getElementById(`p${p}-slots`);
                cont.innerHTML = '';
                slots.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'slot';
                    div.id = `slot-${p}-${s}`;
                    div.onclick = () => draft.assign(p, s);
                    div.innerHTML = `<div class="slot-tag">${s}</div><img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" class="slot-img" id="img-${p}-${s}"><div class="slot-name" id="name-${p}-${s}">---</div>`;
                    cont.appendChild(div);
                });
            });
        },
        updateHOF() {
            const list = document.getElementById('hof-list');
            const saved = JSON.parse(localStorage.getItem('dynasty_hof') || '[]');
            if (saved.length === 0) return;
            list.innerHTML = saved.map(t => `<div class="hof-card"><div style="font-size: 1.2rem; font-weight: 800;">${t.record}</div><div style="font-size: 0.7rem; color: var(--accent);">OVR ${t.ovr}</div></div>`).join('');
        }
    };

    const draft = {
        spin() {
            if (state.isSpinning || state.currentTeam) return;
            state.isSpinning = true;
            const logo = document.getElementById('main-logo');
            const nameText = document.getElementById('main-name');
            const btn = document.getElementById('spin-btn');
            
            logo.classList.remove('glow');
            btn.style.opacity = '0.5';

            let count = 0;
            let max = 35;
            const run = () => {
                const t = teams[Math.floor(Math.random() * teams.length)];
                logo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
                nameText.innerText = t.name;
                
                count++;
                if (count < max) {
                    let delay = count < max - 10 ? 60 : 60 + (count - (max - 10)) * 40;
                    setTimeout(run, delay);
                } else {
                    state.currentTeam = t;
                    state.isSpinning = false;
                    logo.classList.add('glow');
                    btn.style.opacity = '1';
                    this.highlight();
                }
            };
            run();
        },
        highlight() {
            const p = state.currentPlayer;
            document.getElementById('draft-tip').innerText = `PLACE IN PLAYER ${p} ROSTER`;
            slots.forEach(s => {
                if (!state.rosters[p][s]) document.getElementById(`slot-${p}-${s}`).classList.add('available');
            });
        },
        assign(p, s) {
            if (!state.currentTeam || p !== state.currentPlayer || state.rosters[p][s]) return;
            
            const t = state.currentTeam;
            const realOvr = Math.round((t.ovr * 0.7) + (t.m * 0.2) + (t.c * 0.1));
            
            state.rosters[p][s] = realOvr;
            document.getElementById(`img-${p}-${s}`).src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
            document.getElementById(`img-${p}-${s}`).classList.add('active');
            document.getElementById(`name-${p}-${s}`).innerText = t.name;
            document.getElementById(`slot-${p}-${s}`).classList.add('filled');
            
            state.currentTeam = null;
            document.getElementById('draft-tip').innerText = "";
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('available'));
            
            this.updateOvr(p);
            if (state.mode === '1v1') state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
        },
        updateOvr(p) {
            const vals = Object.values(state.rosters[p]);
            const avg = vals.length ? Math.round(vals.reduce((a,b) => a+b, 0) / vals.length) : 0;
            document.getElementById(`p${p}-ovr`).innerText = avg || "--";
            state.rosters[p].total = avg;
        },
        runSimulation() {
            if (Object.keys(state.rosters[1]).length < 6) return alert("Finish Player 1 roster!");
            const res = document.getElementById('sim-result');
            const sub = document.getElementById('sim-subtext');

            if (state.mode === 'solo') {
                let wins = 0;
                const winChance = (state.rosters[1].total - 60) / 45; 
                for (let i = 0; i < 17; i++) if (Math.random() < winChance) wins++;
                res.innerText = `${wins}-${17-wins}`;
                sub.innerText = wins === 17 ? "IMMORTAL STATUS" : "A solid franchise run.";
            } else {
                if (Object.keys(state.rosters[2]).length < 6) return alert("Finish Player 2 roster!");
                const p1 = state.rosters[1].total;
                const p2 = state.rosters[2].total;
                const prob = Math.round(Math.min(Math.max(50 + (p1 - p2) * 4, 5), 95));
                res.innerText = `${prob}%`;
                sub.innerText = `P1 Win Probability against P2`;
            }
        },
        saveTeam() {
            const res = document.getElementById('sim-result').innerText;
            const ovr = state.rosters[1].total;
            if (res === "--") return alert("Simulate a season first!");
            
            const hof = JSON.parse(localStorage.getItem('dynasty_hof') || '[]');
            hof.unshift({ record: res, ovr: ovr });
            localStorage.setItem('dynasty_hof', JSON.stringify(hof.slice(0, 10)));
            ui.updateHOF();
            alert("Team saved to Hall of Fame!");
        },
        reset() {
            state.rosters = { 1: {}, 2: {} };
            state.currentPlayer = 1;
            state.currentTeam = null;
            document.getElementById('p1-ovr').innerText = "--";
            document.getElementById('p2-ovr').innerText = "--";
            document.getElementById('sim-result').innerText = "--";
            ui.renderSlots();
        }
    };

    function startGame() { document.getElementById('landing-page').classList.add('hidden'); }
    ui.init();
</script>

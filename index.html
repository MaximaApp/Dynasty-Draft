<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynasty Draft | 17-0 Builder</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --card: #161b2c;
            --panel: #1e253a;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: #ffffff;
            --panel: #f8fafc;
            --text: #0f172a;
            --text-dim: #64748b;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --border: rgba(0, 0, 0, 0.05);
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border 0.3s ease; }

        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

        /* --- Landing Page --- */
        #landing-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--panel), var(--bg));
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        #landing-page.hidden { transform: translateY(-100%); }

        .hero-title { font-size: 5rem; font-weight: 900; letter-spacing: -3px; text-transform: uppercase; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }

        /* --- Main UI --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: -1px; }

        .draft-section { 
            background: var(--card); border-radius: 30px; padding: 40px; 
            border: 1px solid var(--border); box-shadow: var(--shadow);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            margin-bottom: 40px; position: relative;
        }

        .spinner-box { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #display-logo { width: 140px; height: 140px; object-fit: contain; filter: drop-shadow(0 0 15px transparent); }
        #display-logo.spinning { animation: spinPulse 0.2s infinite alternate; }
        #display-logo.selected { animation: selectPop 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49); filter: drop-shadow(0 0 25px var(--accent-glow)); }

        .team-name-banner { font-size: 2.2rem; font-weight: 800; min-height: 3rem; text-align: center; }

        /* --- Grid & Roster --- */
        .app-grid { display: grid; grid-template-columns: 1fr; gap: 30px; transition: 0.5s; }
        .app-grid.dual { grid-template-columns: 1fr 1fr; }

        .roster-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .slots-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        
        .pos-slot {
            background: var(--panel); border-radius: 18px; padding: 15px; text-align: center;
            border: 2px solid transparent; cursor: pointer; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 140px; transition: 0.3s;
        }

        .pos-slot.waiting { border: 2px dashed var(--accent); animation: borderPulse 1.5s infinite; }
        .pos-slot.waiting:hover { background: var(--accent-glow); transform: scale(1.05); }

        .pos-label { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .pos-img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; opacity: 0.1; }
        .pos-img.active { opacity: 1; }
        .pos-name { font-size: 0.8rem; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pos-ovr { font-weight: 900; color: var(--accent); margin-top: 4px; }

        .hidden-ovr .pos-ovr { filter: blur(6px); }

        /* --- Controls & Settings --- */
        .btn { 
            padding: 14px 30px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-main { background: var(--accent); color: #fff; font-size: 1.1rem; box-shadow: 0 10px 20px var(--accent-glow); }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--accent-glow); }
        .btn-icon { background: var(--card); color: var(--text); border: 1px solid var(--border); }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content { 
            background: var(--card); padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; 
            border: 1px solid var(--border); text-align: left;
        }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        /* --- Win Engine --- */
        .sim-box { margin-top: 40px; text-align: center; padding-bottom: 60px; }
        .record-orb { 
            width: 180px; height: 180px; border-radius: 50%; background: var(--card);
            border: 4px solid var(--accent); display: inline-flex; flex-direction: column;
            align-items: center; justify-content: center; margin-bottom: 20px;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .record-text { font-size: 2.5rem; font-weight: 900; }

        /* --- Animations --- */
        @keyframes spinPulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.1); opacity: 1; } }
        @keyframes selectPop { 0% { transform: scale(0.5); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes borderPulse { 0% { border-color: transparent; } 50% { border-color: var(--accent); } 100% { border-color: transparent; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="hero-title">Dynasty Draft</h1>
        <p style="color: var(--text-dim); font-size: 1.2rem; margin-bottom: 30px;">Build Your 17-0 NFL Legend</p>
        <button class="btn btn-main" onclick="startGame()">ENTER DRAFT</button>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 25px;">Draft Settings</h2>
            <div class="setting-row">
                <span>Dark Mode</span>
                <button class="btn btn-icon" onclick="toggleTheme()" id="theme-btn">🌙</button>
            </div>
            <div class="setting-row">
                <span>Hide Overalls (Hard Mode)</span>
                <input type="checkbox" id="fog-toggle" onchange="toggleFog()">
            </div>
            <div class="setting-row">
                <span>Opponent Mode</span>
                <input type="checkbox" id="mode-toggle" onchange="toggleMode()">
            </div>
            <button class="btn btn-main" style="width: 100%; margin-top: 10px;" onclick="closeSettings()">SAVE & CLOSE</button>
        </div>
    </div>

    <div class="container">
        <nav>
            <div class="logo">DYNASTY DRAFT</div>
            <button class="btn btn-icon" onclick="openSettings()">⚙️ Settings</button>
        </nav>

        <section class="draft-section">
            <div class="spinner-box">
                <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="display-logo">
            </div>
            <div class="team-name-banner" id="display-name">Spin the Wheel...</div>
            <button class="btn btn-main" id="spin-btn" onclick="spinTeam()">GENERATE TEAM</button>
            <p id="instruction" style="color: var(--accent); font-weight: 700; height: 1.2rem;"></p>
        </section>

        <main class="app-grid" id="main-grid">
            <div class="roster-card">
                <div class="roster-header">
                    <h3 id="p1-label">PLAYER 1 ROSTER</h3>
                    <div id="p1-ovr" style="font-weight: 900;">OVR: --</div>
                </div>
                <div class="slots-container" id="p1-slots"></div>
            </div>

            <div class="roster-card hidden" id="p2-card">
                <div class="roster-header">
                    <h3>PLAYER 2 ROSTER</h3>
                    <div id="p2-ovr" style="font-weight: 900;">OVR: --</div>
                </div>
                <div class="slots-container" id="p2-slots"></div>
            </div>
        </main>

        <section class="sim-box">
            <div class="record-orb">
                <div id="sim-record" class="record-text">0-0</div>
                <div style="font-size: 0.7rem; font-weight: 800; color: var(--text-dim);">PREDICTED RECORD</div>
            </div>
            <br>
            <button class="btn btn-main" style="margin: 0 auto;" onclick="runSimulation()">SIMULATE SEASON</button>
        </section>
    </div>

    <script>
        const nflTeams = [
            { id: 'ari', name: 'Cardinals', ovr: 77 }, { id: 'atl', name: 'Falcons', ovr: 81 },
            { id: 'bal', name: 'Ravens', ovr: 91 }, { id: 'buf', name: 'Bills', ovr: 89 },
            { id: 'car', name: 'Panthers', ovr: 72 }, { id: 'chi', name: 'Bears', ovr: 83 },
            { id: 'cin', name: 'Bengals', ovr: 88 }, { id: 'cle', name: 'Browns', ovr: 84 },
            { id: 'dal', name: 'Cowboys', ovr: 87 }, { id: 'den', name: 'Broncos', ovr: 79 },
            { id: 'det', name: 'Lions', ovr: 92 }, { id: 'gb',  name: 'Packers', ovr: 85 },
            { id: 'hou', name: 'Texans', ovr: 87 }, { id: 'ind', name: 'Colts', ovr: 81 },
            { id: 'jax', name: 'Jaguars', ovr: 80 }, { id: 'kc',  name: 'Chiefs', ovr: 94 },
            { id: 'lv',  name: 'Raiders', ovr: 78 }, { id: 'lac', name: 'Chargers', ovr: 84 },
            { id: 'lar', name: 'Rams', ovr: 86 }, { id: 'mia', name: 'Dolphins', ovr: 85 },
            { id: 'min', name: 'Vikings', ovr: 84 }, { id: 'ne',  name: 'Patriots', ovr: 74 },
            { id: 'no',  name: 'Saints', ovr: 78 }, { id: 'nyg', name: 'Giants', ovr: 75 },
            { id: 'nyj', name: 'Jets', ovr: 84 }, { id: 'phi', name: 'Eagles', ovr: 90 },
            { id: 'pit', name: 'Steelers', ovr: 85 }, { id: 'sf',  name: '49ers', ovr: 93 },
            { id: 'sea', name: 'Seahawks', ovr: 81 }, { id: 'tb',  name: 'Buccaneers', ovr: 83 },
            { id: 'ten', name: 'Titans', ovr: 76 }, { id: 'was', name: 'Commanders', ovr: 82 }
        ];

        const positions = ['QB', 'RB', 'WR1', 'WR2', 'TE', 'DEF'];
        let state = {
            theme: 'dark',
            mode: 'solo',
            currentPlayer: 1,
            isSpinning: false,
            currentSelection: null,
            rosters: { 1: {}, 2: {} }
        };

        function startGame() { document.getElementById('landing-page').classList.add('hidden'); }
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', state.theme);
            document.getElementById('theme-btn').innerText = state.theme === 'dark' ? '🌙' : '☀️';
        }

        function toggleMode() {
            state.mode = document.getElementById('mode-toggle').checked ? '1v1' : 'solo';
            document.getElementById('p2-card').classList.toggle('hidden', state.mode === 'solo');
            document.getElementById('main-grid').classList.toggle('dual', state.mode === '1v1');
            resetDraft();
        }

        function toggleFog() {
            document.getElementById('main-grid').classList.toggle('hidden-ovr', document.getElementById('fog-toggle').checked);
        }

        function initRosters() {
            [1, 2].forEach(pNum => {
                const container = document.getElementById(`p${pNum}-slots`);
                container.innerHTML = '';
                positions.forEach(pos => {
                    const slot = document.createElement('div');
                    slot.className = 'pos-slot';
                    slot.id = `slot-${pNum}-${pos}`;
                    slot.innerHTML = `
                        <div class="pos-label">${pos}</div>
                        <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" class="pos-img" id="img-${pNum}-${pos}">
                        <div class="pos-name" id="name-${pNum}-${pos}">---</div>
                        <div class="pos-ovr" id="ovr-${pNum}-${pos}"></div>
                    `;
                    slot.onclick = () => selectSlot(pNum, pos);
                    container.appendChild(slot);
                });
            });
        }

        function spinTeam() {
            if (state.isSpinning || state.currentSelection) return;
            state.isSpinning = true;
            const logo = document.getElementById('display-logo');
            logo.className = 'spinning';
            
            let count = 0;
            const interval = setInterval(() => {
                const rand = nflTeams[Math.floor(Math.random() * nflTeams.length)];
                logo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${rand.id}.png`;
                document.getElementById('display-name').innerText = rand.name;
                count++;
                if (count > 20) {
                    clearInterval(interval);
                    state.currentSelection = rand;
                    state.isSpinning = false;
                    logo.className = 'selected';
                    highlightAvailableSlots();
                }
            }, 80);
        }

        function highlightAvailableSlots() {
            document.getElementById('instruction').innerText = `Select a position for the ${state.currentSelection.name}`;
            positions.forEach(pos => {
                if (!state.rosters[state.currentPlayer][pos]) {
                    document.getElementById(`slot-${state.currentPlayer}-${pos}`).classList.add('waiting');
                }
            });
        }

        function selectSlot(pNum, pos) {
            if (!state.currentSelection || pNum !== state.currentPlayer || state.rosters[pNum][pos]) return;

            // Assign
            state.rosters[pNum][pos] = state.currentSelection;
            const img = document.getElementById(`img-${pNum}-${pos}`);
            img.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${state.currentSelection.id}.png`;
            img.classList.add('active');
            document.getElementById(`name-${pNum}-${pos}`).innerText = state.currentSelection.name;
            document.getElementById(`ovr-${pNum}-${pos}`).innerText = state.currentSelection.ovr;

            // Clean up
            state.currentSelection = null;
            document.getElementById('display-name').innerText = "Team Locked!";
            document.getElementById('instruction').innerText = "";
            document.querySelectorAll('.pos-slot').forEach(s => s.classList.remove('waiting'));
            calculateTeamOvr(pNum);

            // Turn Swap
            if (state.mode === '1v1') {
                state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            }
        }

        function calculateTeamOvr(pNum) {
            const keys = Object.keys(state.rosters[pNum]);
            if (keys.length === 0) return;
            const avg = Math.round(keys.reduce((sum, k) => sum + state.rosters[pNum][k].ovr, 0) / keys.length);
            document.getElementById(`p${pNum}-ovr`).innerText = `OVR: ${avg}`;
            state.rosters[pNum].avg = avg;
        }

        function runSimulation() {
            if (Object.keys(state.rosters[1]).length < 6) return alert("Complete the roster first!");
            const orbText = document.getElementById('sim-record');
            
            if (state.mode === 'solo') {
                let wins = 0;
                const chance = (state.rosters[1].avg - 70) / 35;
                for (let i = 0; i < 17; i++) { if (Math.random() < chance) wins++; }
                orbText.innerText = `${wins}-${17-wins}`;
            } else {
                if (Object.keys(state.rosters[2]).length < 6) return alert("Player 2 roster incomplete!");
                const diff = state.rosters[1].avg - state.rosters[2].avg;
                const p1WinProb = 50 + (diff * 4);
                orbText.innerText = Math.random() * 100 < p1WinProb ? "P1 WINS" : "P2 WINS";
            }
        }

        function resetDraft() {
            state.rosters = { 1: {}, 2: {} };
            state.currentPlayer = 1;
            state.currentSelection = null;
            document.getElementById('sim-record').innerText = "0-0";
            initRosters();
        }

        initRosters();
    </script>
</body>
</html>

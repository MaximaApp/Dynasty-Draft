<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynasty Draft</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: rgba(255, 255, 255, 0.05);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.6);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --radius: 28px;
            --shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: rgba(255, 255, 255, 0.8);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --text: #0f172a;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh; width: 100vw; overflow: hidden; /* App shell is fixed */
        }

        /* --- INTRO PAGE --- */
        #intro {
            position: fixed; inset: 0; z-index: 2000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .intro-title { 
            font-size: 4rem; font-weight: 800; text-align: center; margin-bottom: 2rem;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px var(--accent-glow));
        }

        /* --- MAIN LAYOUT --- */
        #app { height: 100%; display: flex; flex-direction: column; }
        
        /* Scrollable content areas */
        .view-container {
            flex: 1; overflow-y: auto; padding-bottom: 120px; 
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }

        .header { padding: 40px 20px 10px; text-align: center; }
        .header h1 { 
            font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; 
            color: var(--accent); text-shadow: 0 0 10px var(--accent-glow);
        }

        /* --- SPIN SECTION --- */
        .spin-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .logo-ring {
            width: 160px; height: 160px; border-radius: 50%;
            background: var(--card); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        .logo-ring img { width: 75%; height: 75%; object-fit: contain; }
        .team-label { font-size: 2rem; font-weight: 800; text-shadow: 0 0 15px var(--accent-glow); }

        /* --- DRAFT BOARD --- */
        .board-container { padding: 0 20px; margin-bottom: 30px; }
        .player-tag { font-weight: 800; color: var(--accent); margin-bottom: 10px; display: block; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .slot {
            background: var(--card); border-radius: 20px; padding: 20px 5px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s ease;
        }
        .slot.active-turn { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .slot.filled { background: rgba(99, 102, 241, 0.15); border-color: var(--accent); }
        .slot-pos { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); margin-bottom: 5px; }
        .slot-ovr { font-size: 1.5rem; font-weight: 800; transition: 0.3s; }
        .blur-ovr { filter: blur(10px); opacity: 0.3; }

        /* --- TAB BAR --- */
        .tab-bar {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            height: 80px; background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(25px); border-radius: 40px;
            display: flex; align-items: center; justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: var(--shadow);
            z-index: 1000;
        }
        .tab-item { color: var(--text-dim); font-size: 0.7rem; font-weight: 800; text-align: center; flex: 1; transition: 0.3s; }
        .tab-item.active { color: var(--accent); transform: translateY(-5px); }

        /* --- BUTTONS --- */
        .primary-btn {
            background: var(--accent); color: #fff; border: none; padding: 18px 45px;
            border-radius: 40px; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 10px 30px var(--accent-glow); cursor: pointer; transition: 0.2s;
        }
        .primary-btn:active { transform: scale(0.92); opacity: 0.8; }
        .primary-btn:disabled { background: var(--text-dim); box-shadow: none; opacity: 0.5; }

        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); z-index: 3000;
            display: none; align-items: flex-end;
        }
        .modal.show { display: flex; }
        .modal-sheet {
            background: var(--bg); width: 100%; border-radius: 40px 40px 0 0;
            padding: 30px 20px 60px; border-top: 2px solid var(--accent);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .modal.show .modal-sheet { transform: translateY(0); }
        .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }

        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div id="intro">
        <h1 class="intro-title">DYNASTY<br>DRAFT</h1>
        <button class="primary-btn" onclick="enterApp()">PLAY</button>
    </div>

    <div id="app">
        <div id="view-draft" class="view-container">
            <div class="header">
                <h1 id="mode-indicator">SOLO SEASON</h1>
            </div>

            <div class="spin-section">
                <div class="logo-ring">
                    <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="spin-logo">
                </div>
                <div class="team-label" id="spin-label">READY?</div>
                <button class="primary-btn" id="spin-btn" onclick="startSpin()">SPIN TEAM</button>
                <div id="result-text" style="font-weight: 800; font-size: 1.2rem; text-align: center; margin-top: 10px;"></div>
            </div>

            <div class="board-container">
                <span class="player-tag" id="p1-tag">YOUR ROSTER</span>
                <div class="board" id="board-p1"></div>
            </div>

            <div class="board-container" id="container-p2" style="display: none;">
                <span class="player-tag">PLAYER 2 ROSTER</span>
                <div class="board" id="board-p2"></div>
            </div>
        </div>

        <div id="view-settings" class="view-container" style="display: none; padding: 40px 20px;">
            <h2 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 30px; filter: drop-shadow(0 0 10px var(--accent-glow));">Settings</h2>
            <div class="settings-row">
                <span>1v1 Battle Mode</span>
                <input type="checkbox" id="check-1v1" onchange="toggleMode()" style="width: 25px; height: 25px;">
            </div>
            <div class="settings-row">
                <span>Hide Overalls</span>
                <input type="checkbox" id="check-hide" checked onchange="toggleHide()" style="width: 25px; height: 25px;">
            </div>
            <div class="settings-row">
                <span>Light Mode</span>
                <input type="checkbox" id="check-theme" onchange="toggleTheme()" style="width: 25px; height: 25px;">
            </div>
            <br><br>
            <button class="primary-btn" style="width: 100%; background: #ef4444; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);" onclick="resetAll()">RESET ALL DATA</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" id="tab-draft" onclick="switchView('draft')">🏟️<br>DRAFT</div>
        <div class="tab-item" id="tab-settings" onclick="switchView('settings')">⚙️<br>SETTINGS</div>
        <div class="tab-item" onclick="resetAll()">🔄<br>RESET</div>
    </div>

    <div class="modal" id="draft-modal">
        <div class="modal-sheet">
            <h3 id="modal-title" style="text-align:center; font-size: 1.5rem;">Draft Position</h3>
            <div class="choice-grid" id="choice-grid"></div>
        </div>
    </div>

<script>
    const teams = [
        { name: 'Cardinals', id: 'ari' }, { name: 'Falcons', id: 'atl' }, { name: 'Ravens', id: 'bal' },
        { name: 'Bills', id: 'buf' }, { name: 'Panthers', id: 'car' }, { name: 'Bears', id: 'chi' },
        { name: 'Bengals', id: 'cin' }, { name: 'Browns', id: 'cle' }, { name: 'Cowboys', id: 'dal' },
        { name: 'Broncos', id: 'den' }, { name: 'Lions', id: 'det' }, { name: 'Packers', id: 'gb' },
        { name: 'Texans', id: 'hou' }, { name: 'Colts', id: 'ind' }, { name: 'Jaguars', id: 'jax' },
        { name: 'Chiefs', id: 'kc' }, { name: 'Raiders', id: 'lv' }, { name: 'Chargers', id: 'lac' },
        { name: 'Rams', id: 'lar' }, { name: 'Dolphins', id: 'mia' }, { name: 'Vikings', id: 'min' },
        { name: 'Patriots', id: 'ne' }, { name: 'Saints', id: 'no' }, { name: 'Giants', id: 'nyg' },
        { name: 'Jets', id: 'nyj' }, { name: 'Eagles', id: 'phi' }, { name: 'Steelers', id: 'pit' },
        { name: '49ers', id: 'sf' }, { name: 'Seahawks', id: 'sea' }, { name: 'Buccaneers', id: 'tb' },
        { name: 'Titans', id: 'ten' }, { name: 'Commanders', id: 'was' }
    ];

    const positions = ['QB', 'RB', 'WR', 'WR', 'TE', 'DEF'];
    let state = {
        p1: Array(6).fill(null),
        p2: Array(6).fill(null),
        currentPlayer: 1,
        is1v1: false,
        hideOvr: true,
        isSpinning: false,
        gameOver: false
    };

    function enterApp() {
        document.getElementById('intro').style.transform = 'translateY(-100%)';
        init();
    }

    function init() {
        renderBoard('p1');
        renderBoard('p2');
    }

    function renderBoard(playerKey) {
        const board = document.getElementById(`board-${playerKey}`);
        board.innerHTML = '';
        const data = state[playerKey];

        data.forEach((player, i) => {
            const div = document.createElement('div');
            div.className = `slot ${player ? 'filled' : ''}`;
            
            // Highlight turn in 1v1
            if(state.is1v1 && !state.gameOver && state.currentPlayer === (playerKey === 'p1' ? 1 : 2)) {
                div.classList.add('active-turn');
            }

            const ovrVal = player ? player.ovr : '-';
            const blurClass = (state.hideOvr && !state.gameOver && player) ? 'blur-ovr' : '';
            
            div.innerHTML = `
                <div class="slot-pos">${positions[i]}</div>
                <div class="slot-ovr ${blurClass}">${ovrVal}</div>
            `;
            board.appendChild(div);
        });
        checkWinCondition();
    }

    function startSpin() {
        if(state.isSpinning || state.gameOver) return;
        state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;

        let velocity = 50;
        let deceleration = 1.06;
        let spinCount = 0;
        let maxSpins = 25 + Math.floor(Math.random() * 10);

        function tick() {
            spinCount++;
            // Randomly cycle through teams
            const randomTeam = teams[Math.floor(Math.random() * teams.length)];
            document.getElementById('spin-logo').src = `https://a.espncdn.com/i/teamlogos/nfl/500/${randomTeam.id}.png`;
            document.getElementById('spin-label').innerText = randomTeam.name.toUpperCase();
            
            velocity *= deceleration;

            if (spinCount >= maxSpins) {
                state.isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                setTimeout(() => openDraft(randomTeam), 400);
            } else {
                setTimeout(tick, velocity);
            }
        }
        tick();
    }

    function openDraft(team) {
        const modal = document.getElementById('draft-modal');
        const grid = document.getElementById('choice-grid');
        grid.innerHTML = '';
        
        const activeRoster = state.currentPlayer === 1 ? state.p1 : state.p2;

        positions.forEach((pos, i) => {
            if(!activeRoster[i]) {
                const btn = document.createElement('div');
                btn.className = 'slot filled';
                btn.style.padding = '20px';
                btn.innerHTML = `<div class="slot-pos">PICK</div><div class="slot-ovr">${pos}</div>`;
                btn.onclick = () => {
                    const rating = 78 + Math.floor(Math.random() * 18); // Realistic range
                    activeRoster[i] = { pos, ovr: rating };
                    
                    if(state.is1v1) {
                        state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
                    }
                    
                    modal.classList.remove('show');
                    renderBoard('p1');
                    renderBoard('p2');
                };
                grid.appendChild(btn);
            }
        });
        modal.classList.add('show');
    }

    function checkWinCondition() {
        const p1Full = state.p1.every(p => p !== null);
        const p2Full = state.p2.every(p => p !== null);

        if(state.is1v1) {
            if(p1Full && p2Full) finalize();
        } else {
            if(p1Full) finalize();
        }
    }

    function finalize() {
        state.gameOver = true;
        document.getElementById('spin-btn').style.display = 'none';
        
        const p1Score = state.p1.reduce((sum, p) => sum + p.ovr, 0);
        const resEl = document.getElementById('result-text');

        if(state.is1v1) {
            const p2Score = state.p2.reduce((sum, p) => sum + p.ovr, 0);
            const p1Prob = (Math.exp(0.1 * p1Score) / (Math.exp(0.1 * p1Score) + Math.exp(0.1 * p2Score))) * 100;
            const p1Wins = p1Prob > 50;
            resEl.innerHTML = `WIN PROBABILITY: ${p1Wins ? p1Prob.toFixed(1) : (100-p1Prob).toFixed(1)}%<br>${p1Wins ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS'}`;
        } else {
            // Difficulty 17-0 math
            const avg = p1Score / 6;
            const winChance = Math.pow((avg - 70) / 30, 1.5); // Hard curves
            const wins = Math.min(17, Math.max(0, Math.floor(winChance * 17 + (Math.random() * 2))));
            resEl.innerHTML = `SEASON RECORD: ${wins} - ${17-wins}`;
            if(wins === 17) confetti({ particleCount: 200, spread: 100 });
        }
        
        renderBoard('p1');
        renderBoard('p2');
        confetti({ particleCount: 100, origin: { y: 0.7 } });
    }

    function switchView(view) {
        document.getElementById('view-draft').style.display = view === 'draft' ? 'block' : 'none';
        document.getElementById('view-settings').style.display = view === 'settings' ? 'block' : 'none';
        document.getElementById('tab-draft').classList.toggle('active', view === 'draft');
        document.getElementById('tab-settings').classList.toggle('active', view === 'settings');
    }

    function toggleMode() {
        state.is1v1 = document.getElementById('check-1v1').checked;
        document.getElementById('container-p2').style.display = state.is1v1 ? 'block' : 'none';
        document.getElementById('mode-indicator').innerText = state.is1v1 ? '1v1 BATTLE' : 'SOLO SEASON';
        document.getElementById('p1-tag').innerText = state.is1v1 ? 'PLAYER 1 ROSTER' : 'YOUR ROSTER';
        resetAll();
    }

    function toggleHide() { state.hideOvr = document.getElementById('check-hide').checked; renderBoard('p1'); renderBoard('p2'); }
    
    function toggleTheme() {
        const isLight = document.getElementById('check-theme').checked;
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
    }

    function resetAll() {
        state.p1 = Array(6).fill(null);
        state.p2 = Array(6).fill(null);
        state.currentPlayer = 1;
        state.gameOver = false;
        document.getElementById('spin-btn').style.display = 'block';
        document.getElementById('spin-label').innerText = 'READY?';
        document.getElementById('result-text').innerText = '';
        renderBoard('p1');
        renderBoard('p2');
        switchView('draft');
    }
</script>
</body>
</html>

<style>
:root {
--bg: #0b0f1a;
--card-bg: #161b2c;
--text: #ffffff;
--text-muted: #94a3b8;
--accent: #3b82f6;
--accent-glow: rgba(59, 130, 246, 0.4);

    [data-theme="light"] {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #2563eb;
        --accent-glow: rgba(37, 99, 235, 0.15);
        --border: rgba(0, 0, 0, 0.05);
        --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    body {
        background-color: var(--bg);
        color: var(--text);
        transition: background-color 0.4s ease, color 0.4s ease;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* --- Header --- */
    header { text-align: center; margin-bottom: 50px; position: relative; }
    .main-title { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; text-transform: uppercase; background: linear-gradient(135deg, var(--accent), #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub-title { font-size: 1.1rem; color: var(--text-muted); font-weight: 500; margin-top: -5px; }

    .theme-toggle { position: absolute; top: 0; right: 0; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 50%; cursor: pointer; box-shadow: var(--card-shadow); transition: 0.3s; }

    /* --- Spin Section --- */
    .draft-zone { background: var(--card-bg); border-radius: 30px; padding: 40px; border: 1px solid var(--border); box-shadow: var(--card-shadow); margin-bottom: 40px; text-align: center; }
    .spinner-display { height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
    .spinning-logo { width: 160px; height: 160px; object-fit: contain; transition: 0.2s; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
    .spinning-logo.active { animation: pulse 0.6s infinite alternate; filter: drop-shadow(0 0 20px var(--accent)); }
    
    .current-team-name { font-size: 2rem; font-weight: 800; margin: 15px 0; min-height: 2.5rem; }
    .btn { padding: 15px 35px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; }
    .btn-primary { background: var(--accent); color: white; box-shadow: 0 5px 20px var(--accent-glow); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px var(--accent-glow); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* --- Assign Buttons --- */
    .assign-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; max-width: 700px; margin-left: auto; margin-right: auto; opacity: 0; pointer-events: none; transition: 0.5s; }
    .assign-grid.visible { opacity: 1; pointer-events: all; }
    .btn-assign { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; font-size: 0.8rem; border-radius: 10px; }
    .btn-assign:hover { background: var(--accent); color: white; }

    /* --- Toggles --- */
    .toggles-bar { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
    .toggle-item { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.9rem; }
    
    /* --- Roster Layout --- */
    .game-area { display: grid; grid-template-columns: 1fr; gap: 30px; }
    .game-area.mode-1v1 { grid-template-columns: 1fr 1fr; }

    .roster-card { background: var(--card-bg); border-radius: 25px; padding: 30px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
    .roster-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .roster-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

    .slot { background: var(--bg); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid var(--border); transition: 0.3s; position: relative; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .slot:hover { transform: translateY(-5px); border-color: var(--accent); }
    .slot-pos { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; }
    .slot-img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; opacity: 0.2; }
    .slot-img.filled { opacity: 1; }
    .slot-name { font-size: 0.85rem; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-rating { font-size: 1.1rem; font-weight: 900; color: var(--accent); margin-top: 5px; }
    .hidden-rating .slot-rating { filter: blur(8px); }

    /* --- Win Engine --- */
    .engine-zone { margin-top: 50px; text-align: center; }
    .result-box { background: var(--card-bg); padding: 40px; border-radius: 30px; display: inline-block; min-width: 400px; border: 1px solid var(--border); box-shadow: var(--card-shadow); }
    .record-display { font-size: 4rem; font-weight: 900; margin: 10px 0; color: var(--success); }
    
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
        .main-title { font-size: 2.2rem; }
        .game-area.mode-1v1 { grid-template-columns: 1fr; }
        .roster-grid { grid-template-columns: repeat(2, 1fr); }
        .result-box { min-width: 90%; }
    }
</style>

<div class="container">
    <header>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <h1 class="main-title">Dynasty Draft</h1>
        <p class="sub-title">Build Your 17-0 NFL Team</p>
    </header>

    <div class="toggles-bar">
        <div class="toggle-item">
            <span>Solo Mode</span>
            <input type="checkbox" id="modeSwitcher" onchange="toggleMode()">
            <span>1v1 Duel</span>
        </div>
        <div class="toggle-item">
            <span>Fog of War</span>
            <input type="checkbox" id="fogToggle" onchange="toggleFog()">
        </div>
    </div>

    <section class="draft-zone">
        <div class="spinner-display" id="spinner">
            <img src="[https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png](https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png)" class="spinning-logo" id="draftLogo">
            <div class="current-team-name" id="draftName">Spin to start drafting...</div>
        </div>
        
        <button class="btn btn-primary" id="spinBtn" onclick="startSpin()">GENERATE TEAM</button>
        
        <div class="assign-grid" id="assignGrid">
            </div>
        <p id="turnIndicator" style="margin-top: 15px; font-weight: 600; color: var(--accent);"></p>
    </section>

    <div class="game-area" id="gameArea">
        <div class="roster-card" id="p1Card">
            <div class="roster-header">
                <h3 id="p1Label">YOUR ROSTER</h3>
                <div id="p1Ovr" style="font-weight: 800; font-size: 1.2rem;">OVR: --</div>
            </div>
            <div class="roster-grid" id="p1Roster"></div>
        </div>

        <div class="roster-card hidden" id="p2Card">
            <div class="roster-header">
                <h3>OPPONENT ROSTER</h3>
                <div id="p2Ovr" style="font-weight: 800; font-size: 1.2rem;">OVR: --</div>
            </div>
            <div class="roster-grid" id="p2Roster"></div>
        </div>
    </div>

    <section class="engine-zone">
        <div class="result-box">
            <h2 id="engineStatus">Ready to Simulate?</h2>
            <div class="record-display" id="mainResult">--</div>
            <div id="subResult" style="color: var(--text-muted); margin-bottom: 20px;">Complete your roster first</div>
            <button class="btn btn-primary" onclick="runEngine()">RUN WIN ENGINE</button>
        </div>
    </section>
</div>

<script>
    const teams = [
        { id: 'ari', name: 'Cardinals', ovr: 78, color: '#97233F' }, { id: 'atl', name: 'Falcons', ovr: 81, color: '#A71930' },
        { id: 'bal', name: 'Ravens', ovr: 91, color: '#241773' }, { id: 'buf', name: 'Bills', ovr: 89, color: '#00338D' },
        { id: 'car', name: 'Panthers', ovr: 74, color: '#0085CA' }, { id: 'chi', name: 'Bears', ovr: 80, color: '#0B162A' },
        { id: 'cin', name: 'Bengals', ovr: 87, color: '#FB4F14' }, { id: 'cle', name: 'Browns', ovr: 85, color: '#311D00' },
        { id: 'dal', name: 'Cowboys', ovr: 88, color: '#003594' }, { id: 'den', name: 'Broncos', ovr: 77, color: '#FB4F14' },
        { id: 'det', name: 'Lions', ovr: 90, color: '#0076B6' }, { id: 'gb',  name: 'Packers', ovr: 84, color: '#203731' },
        { id: 'hou', name: 'Texans', ovr: 86, color: '#03202F' }, { id: 'ind', name: 'Colts', ovr: 82, color: '#002C5F' },
        { id: 'jax', name: 'Jaguars', ovr: 80, color: '#006778' }, { id: 'kc',  name: 'Chiefs', ovr: 94, color: '#E31837' },
        { id: 'lv',  name: 'Raiders', ovr: 79, color: '#000000' }, { id: 'lac', name: 'Chargers', ovr: 83, color: '#0080C6' },
        { id: 'lar', name: 'Rams', ovr: 84, color: '#003594' }, { id: 'mia', name: 'Dolphins', ovr: 86, color: '#008E97' },
        { id: 'min', name: 'Vikings', ovr: 82, color: '#4F2683' }, { id: 'ne',  name: 'Patriots', ovr: 75, color: '#002244' },
        { id: 'no',  name: 'Saints', ovr: 79, color: '#D3BC8D' }, { id: 'nyg', name: 'Giants', ovr: 76, color: '#0B2265' },
        { id: 'nyj', name: 'Jets', ovr: 83, color: '#125740' }, { id: 'phi', name: 'Eagles', ovr: 89, color: '#004C54' },
        { id: 'pit', name: 'Steelers', ovr: 84, color: '#FFB612' }, { id: 'sf',  name: '49ers', ovr: 93, color: '#AA0000' },
        { id: 'sea', name: 'Seahawks', ovr: 81, color: '#002244' }, { id: 'tb',  name: 'Buccaneers', ovr: 82, color: '#D50A0A' },
        { id: 'ten', name: 'Titans', ovr: 77, color: '#0C2340' }, { id: 'was', name: 'Commanders', ovr: 79, color: '#773141' }
    ];

    const slots = ['QB', 'RB', 'WR1', 'WR2', 'TE', 'DEF'];
    
    let state = {
        mode: 'solo',
        theme: 'dark',
        fog: false,
        currentPlayer: 1,
        isSpinning: false,
        lastSpunTeam: null,
        p1: { roster: {} },
        p2: { roster: {} }
    };

    function init() {
        renderRosters();
        updateTurnText();
    }

    function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', state.theme);
        document.querySelector('.theme-toggle').innerText = state.theme === 'dark' ? '🌙' : '☀️';
    }

    function toggleMode() {
        state.mode = document.getElementById('modeSwitcher').checked ? '1v1' : 'solo';
        document.getElementById('p2Card').classList.toggle('hidden', state.mode === 'solo');
        document.getElementById('gameArea').classList.toggle('mode-1v1', state.mode === '1v1');
        document.getElementById('p1Label').innerText = state.mode === 'solo' ? "YOUR ROSTER" : "PLAYER 1 ROSTER";
        resetGame();
    }

    function toggleFog() {
        state.fog = document.getElementById('fogToggle').checked;
        document.getElementById('gameArea').classList.toggle('hidden-rating', state.fog);
    }

    function resetGame() {
        state.p1.roster = {};
        state.p2.roster = {};
        state.currentPlayer = 1;
        state.lastSpunTeam = null;
        document.getElementById('mainResult').innerText = "--";
        renderRosters();
        updateTurnText();
    }

    function renderRosters() {
        ['p1', 'p2'].forEach(p => {
            const container = document.getElementById(`${p}Roster`);
            container.innerHTML = '';
            slots.forEach(s => {
                const data = state[p].roster[s];
                const div = document.createElement('div');
                div.className = 'slot';
                div.innerHTML = `
                    <div class="slot-pos">${s}</div>
                    <img src="[https://a.espncdn.com/i/teamlogos/nfl/500/$](https://a.espncdn.com/i/teamlogos/nfl/500/$){data ? data.id : 'nfl'}.png" class="slot-img ${data ? 'filled' : ''}">
                    <div class="slot-name">${data ? data.name : 'Empty'}</div>
                    <div class="slot-rating">${data ? data.ovr : ''}</div>
                `;
                container.appendChild(div);
            });
            calculateOvr(p);
        });
    }

    function calculateOvr(player) {
        const keys = Object.keys(state[player].roster);
        if (keys.length === 0) return;
        const sum = keys.reduce((acc, k) => acc + state[player].roster[k].ovr, 0);
        const avg = Math.round(sum / slots.length); // Divide by total slots for progress feel
        document.getElementById(`${player}Ovr`).innerText = `OVR: ${avg}`;
        state[player].avg = avg;
    }

    function startSpin() {
        if (state.isSpinning) return;
        state.isSpinning = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('draftLogo').classList.add('active');
        document.getElementById('assignGrid').classList.remove('visible');

        let count = 0;
        let speed = 50;
        const spin = () => {
            const rand = teams[Math.floor(Math.random() * teams.length)];
            document.getElementById('draftLogo').src = `https://a.espncdn.com/i/teamlogos/nfl/500/${rand.id}.png`;
            document.getElementById('draftName').innerText = rand.name;
            document.getElementById('draftName').style.color = rand.color;
            
            count++;
            if (count < 25) {
                setTimeout(spin, speed);
                speed += count;
            } else {
                state.lastSpunTeam = rand;
                state.isSpinning = false;
                document.getElementById('draftLogo').classList.remove('active');
                showAssignButtons();
            }
        };
        spin();
    }

    function showAssignButtons() {
        const grid = document.getElementById('assignGrid');
        grid.innerHTML = '';
        grid.classList.add('visible');
        
        const p = state.currentPlayer === 1 ? 'p1' : 'p2';
        slots.forEach(s => {
            if (!state[p].roster[s]) {
                const b = document.createElement('button');
                b.className = 'btn-assign';
                b.innerText = `SET AS ${s}`;
                b.onclick = () => assignToSlot(s);
                grid.appendChild(b);
            }
        });
        
        if (grid.children.length === 0) {
            document.getElementById('draftName').innerText = "Roster Full!";
        }
    }

    function assignToSlot(slot) {
        const p = state.currentPlayer === 1 ? 'p1' : 'p2';
        state[p].roster[slot] = { ...state.lastSpunTeam };
        
        document.getElementById('assignGrid').classList.remove('visible');
        document.getElementById('spinBtn').disabled = false;
        
        if (state.mode === '1v1') {
            state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
        }
        
        renderRosters();
        updateTurnText();
        document.getElementById('draftName').innerText = "Team Locked!";
    }

    function updateTurnText() {
        const el = document.getElementById('turnIndicator');
        if (state.mode === 'solo') {
            el.innerText = "";
        } else {
            el.innerText = `Current Turn: Player ${state.currentPlayer}`;
        }
    }

    function runEngine() {
        const p1Ready = Object.keys(state.p1.roster).length === slots.length;
        if (!p1Ready) return alert("Fill Player 1 Roster first!");
        
        const main = document.getElementById('mainResult');
        const sub = document.getElementById('subResult');
        const status = document.getElementById('engineStatus');

        status.innerText = "Simulating Season...";
        main.innerText = "...";

        setTimeout(() => {
            if (state.mode === 'solo') {
                let wins = 0;
                const baseChance = (state.p1.avg - 65) / 40; 
                for (let i = 0; i < 17; i++) {
                    if (Math.random() < baseChance) wins++;
                }
                main.innerText = `${wins}-${17 - wins}`;
                sub.innerText = wins === 17 ? "LEGENDARY 17-0 SEASON!" : "The grind continues.";
            } else {
                const p2Ready = Object.keys(state.p2.roster).length === slots.length;
                if (!p2Ready) return alert("Fill Player 2 Roster first!");
                
                const diff = state.p1.avg - state.p2.avg;
                const p1Prob = Math.round(Math.min(Math.max(50 + (diff * 3), 5), 95));
                main.innerText = `${p1Prob}%`;
                sub.innerText = p1Prob > 50 ? "Player 1 is the favorite" : "Player 2 has the edge";
            }
            status.innerText = "Simulation Complete";
        }, 800);
    }

    init();
</script>

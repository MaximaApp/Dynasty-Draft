<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Dynasty%20Draft%22,%22short_name%22:%22Dynasty%22,%22start_url%22:%22index.html%22,%22display%22:%22standalone%22,%22background_color%22:%22%2305070a%22,%22theme_color%22:%22%236366f1%22,%22icons%22:[{%22src%22:%22https://static.www.nfl.com/image/upload/v1554321393/league/ov7cxsqpp88ih9bdqcry.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}]}">

    <title>Dynasty Draft</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: rgba(255, 255, 255, 0.05);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.6);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --radius: 28px;
            --shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: rgba(255, 255, 255, 0.8);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --text: #0f172a;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100dvh; width: 100vw; overflow: hidden;
        }

        #intro {
            position: fixed; inset: 0; z-index: 2000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1);
        }
        .intro-title { 
            font-size: 4rem; font-weight: 800; text-align: center; margin-bottom: 2rem;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px var(--accent-glow));
            animation: titlePulse 3s infinite ease-in-out;
        }
        @keyframes titlePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .app-header {
            padding: 30px 20px 10px;
            text-align: left;
        }
        .app-header h1 {
            font-size: 1.8rem; font-weight: 800; margin: 0;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .app-header p {
            font-size: 0.75rem; color: var(--text-dim); margin: 4px 0 0;
            font-weight: 600; letter-spacing: 0.5px; opacity: 0.7;
        }

        #app { height: 100dvh; display: flex; flex-direction: column; }
        
        .view-container {
            flex: 1; overflow-y: auto; padding-bottom: 20px; 
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }

        .section-title { padding: 10px 20px; text-align: center; }
        .section-title h2 { 
            font-size: 1rem; letter-spacing: 4px; text-transform: uppercase; 
            color: var(--accent); text-shadow: 0 0 10px var(--accent-glow);
        }

        .spin-section { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .logo-ring {
            width: 150px; height: 150px; border-radius: 50%;
            background: var(--card); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .logo-ring img { width: 75%; height: 75%; object-fit: contain; transition: transform 0.2s; }
        .team-label { font-size: 1.8rem; font-weight: 800; text-shadow: 0 0 15px var(--accent-glow); }

        .board-container { padding: 0 20px; margin-bottom: 25px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .player-tag { font-weight: 800; color: var(--accent); margin-bottom: 10px; display: block; font-size: 0.8rem; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        
        .slot {
            background: var(--card); border-radius: 20px; padding: 15px 5px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100px;
        }
        .slot:active { transform: scale(0.95); }
        .slot.active-turn { border: 2px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .slot.filled { 
            background: rgba(99, 102, 241, 0.15); border-color: var(--accent);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.8); } to { transform: scale(1); } }
        
        .slot-pos { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); margin-bottom: 5px; }
        .slot-logo { width: 65px; height: 65px; object-fit: contain; margin-top: 5px; }

        .nav-bar {
            height: 80px; background: var(--bg);
            display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000; flex-shrink: 0;
        }
        .nav-item { 
            color: var(--text-dim); font-size: 0.8rem; font-weight: 800; 
            text-align: center; flex: 1; transition: 0.3s; cursor: pointer;
            letter-spacing: 1px;
        }
        .nav-item.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        .primary-btn {
            background: var(--accent); color: #fff; border: none; padding: 18px 45px;
            border-radius: 40px; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 10px 30px var(--accent-glow); cursor: pointer; transition: 0.3s;
        }
        .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 35px var(--accent-glow); }
        .primary-btn:active { transform: scale(0.95); }
        
        .reset-btn {
            background: transparent; border: 1.5px solid rgba(255,255,255,0.1);
            color: var(--text-dim); padding: 10px 30px; border-radius: 30px;
            font-size: 0.8rem; font-weight: 800; margin-top: 5px; transition: 0.3s;
        }
        .reset-btn:hover { color: #ef4444; border-color: #ef4444; }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); z-index: 3000;
            display: none; align-items: flex-end;
        }
        .modal.show { display: flex; }
        .modal-sheet {
            background: var(--bg); width: 100%; border-radius: 40px 40px 0 0;
            padding: 30px 20px 60px; border-top: 2px solid var(--accent);
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .modal.show .modal-sheet { transform: translateY(0); }
        .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }

        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: slideLeft 0.4s ease forwards; opacity: 0;
        }
        @keyframes slideLeft { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="intro">
        <h1 class="intro-title">DYNASTY<br>DRAFT</h1>
        <button class="primary-btn" onclick="enterApp()">PLAY</button>
    </div>

    <div id="app">
        <header class="app-header">
            <h1>Dynasty Draft</h1>
            <p>Build Your Own 17-0 NFL Team</p>
        </header>

        <div id="view-draft" class="view-container">
            <div class="section-title">
                <h2 id="mode-indicator">SOLO SEASON</h2>
            </div>

            <div class="spin-section">
                <div class="logo-ring" id="logo-ring">
                    <img src="https://static.www.nfl.com/image/upload/v1554321393/league/ov7cxsqpp88ih9bdqcry.png" id="spin-logo">
                </div>
                <div class="team-label" id="spin-label">READY?</div>
                <button class="primary-btn" id="spin-btn" onclick="startSpin()">RANDOMIZE</button>
                <button class="reset-btn" onclick="resetAll()">RESET</button>
                <div id="result-text" style="font-weight: 800; font-size: 1.2rem; text-align: center; margin-top: 10px;"></div>
            </div>

            <div class="board-container">
                <span class="player-tag" id="p1-tag">PLAYER 1 ROSTER</span>
                <div class="board" id="board-p1"></div>
            </div>

            <div class="board-container" id="container-p2" style="display: none;">
                <span class="player-tag">PLAYER 2 ROSTER</span>
                <div class="board" id="board-p2"></div>
            </div>
        </div>

        <div id="view-settings" class="view-container" style="display: none; padding: 20px;">
            <h2 style="font-size: 2.2rem; font-weight: 800; margin: 20px 0 30px;">SETTINGS</h2>
            <div class="settings-row" style="animation-delay: 0.1s;">
                <span>1v1 Mode</span>
                <input type="checkbox" id="check-1v1" onchange="toggleMode()" style="width: 25px; height: 25px;">
            </div>
            <div class="settings-row" style="animation-delay: 0.2s;">
                <span>Light Mode</span>
                <input type="checkbox" id="check-theme" onchange="toggleTheme()" style="width: 25px; height: 25px;">
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active" id="nav-draft" onclick="switchView('draft')">DRAFT</div>
            <div class="nav-item" id="nav-settings" onclick="switchView('settings')">SETTINGS</div>
        </nav>
    </div>

    <div class="modal" id="draft-modal">
        <div class="modal-sheet">
            <div style="text-align: center; margin-bottom: 10px;">
                <img id="modal-team-logo" src="" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h3 id="modal-title" style="text-align:center; font-size: 1.4rem; font-weight: 800; margin:0;">Draft Position</h3>
            <div class="choice-grid" id="choice-grid"></div>
        </div>
    </div>

<script>
    // Service Worker Registration for "Installable" App
    if ('serviceWorker' in navigator) {
        const sw = 'data:application/javascript;base64,' + btoa('self.addEventListener("fetch", (event) => { event.respondWith(fetch(event.request)); });');
        navigator.serviceWorker.register(sw);
    }

    const teams = [
        { name: 'Cardinals', id: 'ari' }, { name: 'Falcons', id: 'atl' }, { name: 'Ravens', id: 'bal' },
        { name: 'Bills', id: 'buf' }, { name: 'Panthers', id: 'car' }, { name: 'Bears', id: 'chi' },
        { name: 'Bengals', id: 'cin' }, { name: 'Browns', id: 'cle' }, { name: 'Cowboys', id: 'dal' },
        { name: 'Broncos', id: 'den' }, { name: 'Lions', id: 'det' }, { name: 'Packers', id: 'gb' },
        { name: 'Texans', id: 'hou' }, { name: 'Colts', id: 'ind' }, { name: 'Jaguars', id: 'jax' },
        { name: 'Chiefs', id: 'kc' }, { name: 'Raiders', id: 'lv' }, { name: 'Chargers', id: 'lac' },
        { name: 'Rams', id: 'lar' }, { name: 'Dolphins', id: 'mia' }, { name: 'Vikings', id: 'min' },
        { name: 'Patriots', id: 'ne' }, { name: 'Saints', id: 'no' }, { name: 'Giants', id: 'nyg' },
        { name: 'Jets', id: 'nyj' }, { name: 'Eagles', id: 'phi' }, { name: 'Steelers', id: 'pit' },
        { name: '49ers', id: 'sf' }, { name: 'Seahawks', id: 'sea' }, { name: 'Buccaneers', id: 'tb' },
        { name: 'Titans', id: 'ten' }, { name: 'Commanders', id: 'was' }
    ];

    const positions = ['QB', 'RB', 'WR', 'WR', 'TE', 'DEF'];
    let state = {
        p1: Array(6).fill(null),
        p2: Array(6).fill(null),
        currentPlayer: 1,
        is1v1: false,
        isSpinning: false,
        gameOver: false
    };

    function enterApp() {
        document.getElementById('intro').style.transform = 'translateY(-100%)';
        init();
    }

    function init() {
        renderBoard('p1');
        renderBoard('p2');
    }

    function renderBoard(playerKey) {
        const board = document.getElementById(`board-${playerKey}`);
        board.innerHTML = '';
        const data = state[playerKey];

        data.forEach((player, i) => {
            const div = document.createElement('div');
            div.className = `slot ${player ? 'filled' : ''}`;
            if(state.is1v1 && !state.gameOver && state.currentPlayer === (playerKey === 'p1' ? 1 : 2)) {
                div.classList.add('active-turn');
            }
            
            const posLabel = `<div class="slot-pos">${positions[i]}</div>`;
            let content = `<div style="font-size: 1.5rem; opacity: 0.1;">?</div>`;
            
            if (player) {
                content = `<img class="slot-logo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${player.teamId}.png">`;
            }

            div.innerHTML = posLabel + content;
            board.appendChild(div);
        });
        checkWinCondition();
    }

    function startSpin() {
        if(state.isSpinning || state.gameOver) return;
        state.isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        const ring = document.getElementById('logo-ring');
        ring.style.transform = 'scale(1.1)';

        let velocity = 50;
        let deceleration = 1.07;
        let spinCount = 0;
        let maxSpins = 20 + Math.floor(Math.random() * 10);

        function tick() {
            spinCount++;
            const randomTeam = teams[Math.floor(Math.random() * teams.length)];
            const logo = document.getElementById('spin-logo');
            logo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${randomTeam.id}.png`;
            document.getElementById('spin-label').innerText = randomTeam.name.toUpperCase();
            velocity *= deceleration;

            if (spinCount >= maxSpins) {
                state.isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                ring.style.transform = 'scale(1)';
                setTimeout(() => openDraft(randomTeam), 500);
            } else {
                setTimeout(tick, velocity);
            }
        }
        tick();
    }

    function openDraft(team) {
        const modal = document.getElementById('draft-modal');
        const grid = document.getElementById('choice-grid');
        document.getElementById('modal-team-logo').src = `https://a.espncdn.com/i/teamlogos/nfl/500/${team.id}.png`;
        grid.innerHTML = '';
        const activeRoster = state.currentPlayer === 1 ? state.p1 : state.p2;

        positions.forEach((pos, i) => {
            if(!activeRoster[i]) {
                const btn = document.createElement('div');
                btn.className = 'slot filled';
                btn.style.padding = '25px';
                btn.innerHTML = `<div class="slot-pos">DRAFT</div><div class="slot-ovr" style="font-size:1.2rem; font-weight:800;">${pos}</div>`;
                btn.onclick = () => {
                    activeRoster[i] = { pos, teamId: team.id };
                    if(state.is1v1) state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
                    modal.classList.remove('show');
                    renderBoard('p1');
                    renderBoard('p2');
                };
                grid.appendChild(btn);
            }
        });
        modal.classList.add('show');
    }

    function checkWinCondition() {
        const p1Full = state.p1.every(p => p !== null);
        const p2Full = state.p2.every(p => p !== null);
        if(state.is1v1) { if(p1Full && p2Full) finalize(); } else { if(p1Full) finalize(); }
    }

    function finalize() {
        state.gameOver = true;
        confetti({ particleCount: 150, origin: { y: 0.6 } });
    }

    function switchView(view) {
        document.getElementById('view-draft').style.display = view === 'draft' ? 'block' : 'none';
        document.getElementById('view-settings').style.display = view === 'settings' ? 'block' : 'none';
        document.getElementById('nav-draft').classList.toggle('active', view === 'draft');
        document.getElementById('nav-settings').classList.toggle('active', view === 'settings');
    }

    function toggleMode() {
        state.is1v1 = document.getElementById('check-1v1').checked;
        document.getElementById('container-p2').style.display = state.is1v1 ? 'block' : 'none';
        document.getElementById('mode-indicator').innerText = state.is1v1 ? '1v1 BATTLE' : 'SOLO SEASON';
        document.getElementById('p1-tag').innerText = state.is1v1 ? 'PLAYER 1 ROSTER' : 'YOUR ROSTER';
        resetAll();
    }

    function toggleTheme() {
        const isLight = document.getElementById('check-theme').checked;
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
    }

    function resetAll() {
        state.p1 = Array(6).fill(null);
        state.p2 = Array(6).fill(null);
        state.currentPlayer = 1;
        state.gameOver = false;
        document.getElementById('spin-btn').disabled = false;
        document.getElementById('spin-label').innerText = 'READY?';
        document.getElementById('result-text').innerText = '';
        document.getElementById('spin-logo').src = "https://static.www.nfl.com/image/upload/v1554321393/league/ov7cxsqpp88ih9bdqcry.png";
        renderBoard('p1');
        renderBoard('p2');
        switchView('draft');
    }
</script>
</body>
</html>

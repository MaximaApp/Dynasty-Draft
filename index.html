<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynasty Draft Pro</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: rgba(22, 27, 34, 0.8);
            --panel: #161b22;
            --text: #f0f6fc;
            --text-dim: #8b949e;
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.6);
            --border: rgba(48, 54, 61, 0.8);
            --nav: rgba(22, 27, 34, 0.95);
        }

        [data-theme="light"] {
            --bg: #f8f9fa;
            --card: rgba(255, 255, 255, 0.9);
            --panel: #ffffff;
            --text: #1f2328;
            --text-dim: #636c76;
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.2);
            --border: #d0d7de;
            --nav: rgba(255, 255, 255, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; transition: background 0.5s ease; }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glowPulse { 0% { box-shadow: 0 0 5px var(--accent-glow); } 50% { box-shadow: 0 0 25px var(--accent-glow); } 100% { box-shadow: 0 0 5px var(--accent-glow); } }
        @keyframes spin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1.1); } }

        /* --- Layout --- */
        .page { display: none; padding: 20px; padding-bottom: 100px; animation: fadeIn 0.4s ease-out; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; }

        /* --- UI Elements --- */
        .glass-card { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 24px; padding: 25px; box-shadow: 0 12px 32px rgba(0,0,0,0.2); margin-bottom: 20px; }
        .soft-btn { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 16px; font-weight: 600; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 1rem; }
        .soft-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }
        .soft-btn:active { transform: scale(0.96); }

        /* --- Draft Stage --- */
        .wheel-container { height: 200px; display: flex; align-items: center; justify-content: center; margin: 20px 0; position: relative; }
        #wheel-logo { width: 140px; height: 140px; object-fit: contain; transition: 0.5s; z-index: 2; }
        .spinning #wheel-logo { animation: spin 0.2s infinite linear; }
        .glow-effect { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: var(--accent-glow); filter: blur(40px); opacity: 0; transition: 0.5s; }
        .is-ready .glow-effect { opacity: 0.7; animation: glowPulse 2s infinite; }

        /* --- Roster Grid --- */
        .roster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .slot { background: var(--panel); border: 1.5px solid var(--border); border-radius: 20px; padding: 15px; text-align: center; transition: 0.3s; position: relative; overflow: hidden; }
        .slot.active-target { border-color: var(--accent); animation: glowPulse 1.5s infinite; }
        .slot-img { width: 40px; height: 40px; margin-bottom: 8px; filter: grayscale(1); opacity: 0.2; transition: 0.3s; }
        .slot.filled .slot-img { filter: grayscale(0); opacity: 1; }
        .ovr-badge { position: absolute; top: 10px; right: 10px; font-weight: 900; color: var(--accent); font-size: 0.8rem; }

        /* --- Navigation --- */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--nav); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 30px; display: flex; justify-content: space-around; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; }
        .nav-item { color: var(--text-dim); text-decoration: none; font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 1.2rem; }

        /* --- Fog of War --- */
        .fog-mode .ovr-badge, .fog-mode #total-ovr { filter: blur(6px); user-select: none; }

        /* Settings Rows */
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        input[type="checkbox"] { width: 40px; height: 20px; accent-color: var(--accent); }
    </style>
</head>
<body id="app-body">

    <div id="draft-page" class="page active">
        <div class="glass-card" style="text-align: center;">
            <h1 id="picked-team-name" style="font-weight: 800; letter-spacing: -1px;">DRAFT BOARD</h1>
            <div class="wheel-container" id="wheel-box">
                <div class="glow-effect"></div>
                <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="wheel-logo">
            </div>
            <button class="soft-btn" id="spin-btn" onclick="game.spin()">SPIN TEAM</button>
            <p id="draft-status" style="margin-top: 15px; font-size: 0.9rem; color: var(--accent); height: 1.2rem; font-weight: 600;"></p>
        </div>
        
        <div class="glass-card" style="text-align: center;">
            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px;">CURRENT ROSTER STRENGTH</div>
            <div id="total-ovr" style="font-size: 2.5rem; font-weight: 900; color: var(--accent);">--</div>
            <button class="soft-btn" style="margin-top:15px; background: #28a745; width: 100%;" onclick="game.saveRoster()">SAVE ROSTER</button>
        </div>
    </div>

    <div id="roster-page" class="page">
        <h2 style="margin-bottom: 20px;">Your Roster</h2>
        <div class="roster-grid" id="slots-container"></div>
    </div>

    <div id="settings-page" class="page">
        <div class="glass-card">
            <h2>Settings</h2>
            <div class="settings-row"><span>Hide Rankings (Blur)</span><input type="checkbox" id="set-fog" onchange="game.applyFog()"></div>
            <div class="settings-row"><span>Light Mode</span><input type="checkbox" id="set-theme" onchange="game.applyTheme()"></div>
            <div class="settings-row"><span>Include Coach</span><input type="checkbox" id="set-coach" onchange="game.rebuild()"></div>
            <div class="settings-row"><span>Include O-Line</span><input type="checkbox" id="set-oline" onchange="game.rebuild()"></div>
            <button class="soft-btn" style="width: 100%; margin-top: 20px; background: #dc3545;" onclick="game.reset()">RESET ALL DATA</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="game.nav('draft', this)"><i>🎯</i>Draft</div>
        <div class="nav-item" onclick="game.nav('roster', this)"><i>📋</i>Roster</div>
        <div class="nav-item" onclick="game.nav('settings', this)"><i>⚙️</i>Settings</div>
    </nav>

    <script>
        const TEAMS = [
            { id: 'cin', n: 'Bengals', qb: 93, rb: 81, wr: 99, te: 80, def: 84, c: 92, ol: 85 },
            { id: 'kc', n: 'Chiefs', qb: 99, rb: 87, wr: 85, te: 98, def: 95, c: 99, ol: 92 },
            { id: 'bal', n: 'Ravens', qb: 98, rb: 94, wr: 84, te: 94, def: 95, c: 88, ol: 83 },
            { id: 'sf', n: '49ers', qb: 88, rb: 99, wr: 92, te: 97, def: 96, c: 90, ol: 95 },
            { id: 'phi', n: 'Eagles', qb: 86, rb: 92, wr: 95, te: 89, def: 88, c: 85, ol: 96 },
            { id: 'det', n: 'Lions', qb: 83, rb: 88, wr: 95, te: 91, def: 86, c: 84, ol: 98 },
            { id: 'dal', n: 'Cowboys', qb: 90, rb: 78, wr: 96, te: 84, def: 92, c: 82, ol: 89 },
            { id: 'mia', n: 'Dolphins', qb: 84, rb: 85, wr: 99, te: 77, def: 83, c: 80, ol: 78 },
            { id: 'buf', n: 'Bills', qb: 92, rb: 86, wr: 82, te: 86, def: 87, c: 85, ol: 84 },
            { id: 'nyj', n: 'Jets', qb: 81, rb: 90, wr: 88, te: 79, def: 97, c: 78, ol: 86 }
        ];

        const game = {
            state: {
                spinning: false,
                currentPick: null,
                roster: JSON.parse(localStorage.getItem('dynasty_roster')) || {}
            },

            init() {
                this.rebuild();
                this.applyTheme();
                this.updateOvr();
            },

            nav(pageId, el) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(pageId + '-page').classList.add('active');
                el.classList.add('active');
            },

            rebuild() {
                const container = document.getElementById('slots-container');
                container.innerHTML = '';
                const base = ['QB', 'RB', 'WR', 'TE', 'DEF'];
                if (document.getElementById('set-coach').checked) base.push('COACH');
                if (document.getElementById('set-oline').checked) base.push('OLINE');

                base.forEach(pos => {
                    const data = this.state.roster[pos];
                    const div = document.createElement('div');
                    div.className = `slot ${data ? 'filled' : ''}`;
                    div.id = `slot-${pos}`;
                    div.onclick = () => this.assign(pos);
                    div.innerHTML = `
                        <div class="ovr-badge">${data ? data.ovr : ''}</div>
                        <div style="font-size: 0.6rem; font-weight: 800; opacity: 0.5;">${pos}</div>
                        <img src="${data ? `https://a.espncdn.com/i/teamlogos/nfl/500/${data.id}.png` : 'https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png'}" class="slot-img">
                        <div style="font-size: 0.75rem; font-weight: 700;">${data ? data.team : 'EMPTY'}</div>
                    `;
                    container.appendChild(div);
                });
            },

            spin() {
                if (this.state.spinning || this.state.currentPick) return;
                this.state.spinning = true;
                const box = document.getElementById('wheel-box');
                const logo = document.getElementById('wheel-logo');
                const title = document.getElementById('picked-team-name');
                box.classList.add('spinning');
                
                let i = 0;
                const interval = setInterval(() => {
                    const temp = TEAMS[Math.floor(Math.random() * TEAMS.length)];
                    logo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${temp.id}.png`;
                    title.innerText = temp.n.toUpperCase();
                    i++;
                    if (i > 25) {
                        clearInterval(interval);
                        this.state.currentPick = TEAMS.find(t => t.n.toUpperCase() === title.innerText);
                        box.classList.remove('spinning');
                        box.classList.add('is-ready');
                        this.state.spinning = false;
                        document.getElementById('draft-status').innerText = "SELECT A SLOT IN ROSTER TAB";
                        document.querySelectorAll('.slot').forEach(s => {
                            if (!s.classList.contains('filled')) s.classList.add('active-target');
                        });
                    }
                }, 80);
            },

            assign(pos) {
                if (!this.state.currentPick || this.state.roster[pos]) return;
                
                const t = this.state.currentPick;
                const ratingMap = { 'QB': t.qb, 'RB': t.rb, 'WR': t.wr, 'TE': t.te, 'DEF': t.def, 'COACH': t.c, 'OLINE': t.ol };
                
                this.state.roster[pos] = { id: t.id, team: t.n, ovr: ratingMap[pos] };
                this.state.currentPick = null;
                
                document.getElementById('wheel-box').classList.remove('is-ready');
                document.getElementById('draft-status').innerText = "PICK SAVED!";
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('active-target'));
                
                this.rebuild();
                this.updateOvr();
            },

            updateOvr() {
                const vals = Object.values(this.state.roster).map(v => v.ovr);
                if (!vals.length) return;
                const avg = Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
                document.getElementById('total-ovr').innerText = avg;
            },

            saveRoster() {
                localStorage.setItem('dynasty_roster', JSON.stringify(this.state.roster));
                alert("Roster Saved to Browser!");
            },

            applyTheme() {
                const isLight = document.getElementById('set-theme').checked;
                document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
            },

            applyFog() {
                document.getElementById('app-body').classList.toggle('fog-mode', document.getElementById('set-fog').checked);
            },

            reset() {
                if (confirm("Reset everything?")) {
                    localStorage.clear();
                    location.reload();
                }
            }
        };

        game.init();
    </script>
</body>
</html>

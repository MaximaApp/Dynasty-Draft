<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynasty Draft</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card: rgba(255, 255, 255, 0.05);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.5);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --radius: 28px;
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --card: rgba(0, 0, 0, 0.03);
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.3);
            --text: #0f172a;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden;
            height: 100vh; width: 100vw;
        }

        /* --- INTRO PAGE --- */
        #intro {
            position: fixed; inset: 0; z-index: 1000; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }
        .intro-title { 
            font-size: 3.5rem; font-weight: 800; text-align: center; margin-bottom: 2rem;
            background: linear-gradient(to bottom, #fff, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px var(--accent-glow));
        }

        /* --- MAIN LAYOUT --- */
        #app { height: 100%; display: flex; flex-direction: column; padding-bottom: 90px; }
        
        .header { padding: 40px 20px 20px; text-align: center; }
        .header h1 { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }

        /* --- SPIN SECTION --- */
        .spin-container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; gap: 20px;
        }
        .logo-ring {
            width: 180px; height: 180px; border-radius: 50%;
            background: var(--card); border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--accent-glow); transition: 0.3s;
        }
        .logo-ring img { width: 70%; height: 70%; object-fit: contain; }
        .team-label { font-size: 1.8rem; font-weight: 800; min-height: 40px; text-shadow: 0 0 15px var(--accent-glow); }

        /* --- DRAFT BOARD --- */
        .board { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; 
            padding: 20px; max-width: 500px; margin: 0 auto; width: 100%;
        }
        .slot {
            background: var(--card); border-radius: 20px; padding: 15px 5px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .slot.filled { border-color: var(--accent); background: rgba(99, 102, 241, 0.1); }
        .slot-pos { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); margin-bottom: 4px; }
        .slot-ovr { font-size: 1.4rem; font-weight: 800; }
        .blur-ovr { filter: blur(8px); opacity: 0.5; }

        /* --- TABS --- */
        .tab-bar {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            height: 70px; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px); border-radius: 35px;
            display: flex; align-items: center; justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: var(--shadow);
            z-index: 500;
        }
        .tab-item { color: var(--text-dim); font-size: 0.75rem; font-weight: 600; text-align: center; flex: 1; }
        .tab-item.active { color: var(--accent); }

        /* --- BUTTONS --- */
        .primary-btn {
            background: var(--accent); color: #fff; border: none; padding: 16px 40px;
            border-radius: 40px; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 10px 30px var(--accent-glow); cursor: pointer;
        }
        .primary-btn:active { transform: scale(0.95); }

        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); z-index: 2000;
            display: none; align-items: flex-end;
        }
        .modal.show { display: flex; }
        .modal-sheet {
            background: var(--bg); width: 100%; border-radius: 40px 40px 0 0;
            padding: 30px 20px 50px; border-top: 1px solid var(--accent);
            transform: translateY(100%); transition: transform 0.4s ease;
        }
        .modal.show .modal-sheet { transform: translateY(0); }
        .choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }

        /* --- SETTINGS --- */
        .settings-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div id="intro">
        <h1 class="intro-title">DYNASTY<br>DRAFT</h1>
        <button class="primary-btn" onclick="enterApp()">PLAY</button>
    </div>

    <div id="app">
        <div id="view-draft" class="view">
            <div class="header">
                <h1 id="view-title">Solo Season</h1>
            </div>

            <div class="spin-section">
                <div class="spin-container">
                    <div class="logo-ring" id="logo-ring">
                        <img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="spin-logo">
                    </div>
                    <div class="team-label" id="spin-label">Ready?</div>
                    <button class="primary-btn" id="spin-btn" onclick="startSpin()">SPIN TEAM</button>
                    <button class="primary-btn" id="sim-btn" onclick="simSeason()" style="display: none; background: #10b981;">SIM SEASON</button>
                </div>
            </div>

            <div class="board" id="main-board">
                </div>
        </div>

        <div id="view-settings" class="view" style="display: none; padding: 40px 20px;">
            <h2 style="font-size: 2rem; margin-bottom: 20px;">Settings</h2>
            <div class="settings-row">
                <span>1v1 Battle Mode</span>
                <input type="checkbox" id="check-1v1" onchange="toggleMode()">
            </div>
            <div class="settings-row">
                <span>Hide Overalls</span>
                <input type="checkbox" id="check-hide" checked onchange="toggleHide()">
            </div>
            <div class="settings-row">
                <span>Light Mode</span>
                <input type="checkbox" id="check-theme" onchange="toggleTheme()">
            </div>
            <br>
            <button class="primary-btn" style="width: 100%; background: #ef4444;" onclick="resetAll()">RESET GAME</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchView('draft')">🏟️<br>Draft</div>
        <div class="tab-item" onclick="switchView('settings')">⚙️<br>Settings</div>
        <div class="tab-item" onclick="resetAll()">🔄<br>Reset</div>
    </div>

    <div class="modal" id="draft-modal">
        <div class="modal-sheet">
            <h3 id="modal-title" style="text-align:center">Choose Position</h3>
            <div class="choice-grid" id="choice-grid"></div>
        </div>
    </div>

<script>
    const teams = [
        { name: 'Cardinals', id: 'ari' }, { name: 'Falcons', id: 'atl' }, { name: 'Ravens', id: 'bal' },
        { name: 'Bills', id: 'buf' }, { name: 'Panthers', id: 'car' }, { name: 'Bears', id: 'chi' },
        { name: 'Bengals', id: 'cin' }, { name: 'Browns', id: 'cle' }, { name: 'Cowboys', id: 'dal' },
        { name: 'Broncos', id: 'den' }, { name: 'Lions', id: 'det' }, { name: 'Packers', id: 'gb' },
        { name: 'Texans', id: 'hou' }, { name: 'Colts', id: 'ind' }, { name: 'Jaguars', id: 'jax' },
        { name: 'Chiefs', id: 'kc' }, { name: 'Raiders', id: 'lv' }, { name: 'Chargers', id: 'lac' },
        { name: 'Rams', id: 'lar' }, { name: 'Dolphins', id: 'mia' }, { name: 'Vikings', id: 'min' },
        { name: 'Patriots', id: 'ne' }, { name: 'Saints', id: 'no' }, { name: 'Giants', id: 'nyg' },
        { name: 'Jets', id: 'nyj' }, { name: 'Eagles', id: 'phi' }, { name: 'Steelers', id: 'pit' },
        { name: '49ers', id: 'sf' }, { name: 'Seahawks', id: 'sea' }, { name: 'Buccaneers', id: 'tb' },
        { name: 'Titans', id: 'ten' }, { name: 'Commanders', id: 'was' }
    ];

    const positions = ['QB', 'RB', 'WR', 'WR', 'TE', 'DEF'];
    let state = {
        roster: Array(6).fill(null),
        is1v1: false,
        hideOvr: true,
        isSpinning: false
    };

    function enterApp() {
        document.getElementById('intro').style.transform = 'translateY(-100%)';
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('main-board');
        board.innerHTML = '';
        state.roster.forEach((player, i) => {
            const div = document.createElement('div');
            div.className = `slot ${player ? 'filled' : ''}`;
            const ovrClass = state.hideOvr && player ? 'blur-ovr' : '';
            div.innerHTML = `
                <div class="slot-pos">${positions[i]}</div>
                <div class="slot-ovr ${ovrClass}">${player ? player.ovr : '-'}</div>
            `;
            board.appendChild(div);
        });
        checkFull();
    }

    function startSpin() {
        if(state.isSpinning) return;
        state.isSpinning = true;
        
        let velocity = 100;
        let deceleration = 1.05;
        let currentIdx = 0;

        function tick() {
            currentIdx = (currentIdx + 1) % teams.length;
            const team = teams[currentIdx];
            document.getElementById('spin-logo').src = `https://a.espncdn.com/i/teamlogos/nfl/500/${team.id}.png`;
            document.getElementById('spin-label').innerText = team.name;
            
            velocity *= deceleration;
            
            if (velocity > 600) {
                state.isSpinning = false;
                setTimeout(() => openDraft(team), 500);
            } else {
                setTimeout(tick, velocity / 10);
            }
        }
        tick();
    }

    function openDraft(team) {
        const modal = document.getElementById('draft-modal');
        const grid = document.getElementById('choice-grid');
        grid.innerHTML = '';
        
        // Show available slots
        positions.forEach((pos, i) => {
            if(!state.roster[i]) {
                const btn = document.createElement('div');
                btn.className = 'slot filled';
                btn.style.padding = '20px';
                btn.innerHTML = `<div class="slot-pos">DRAFT</div><div class="slot-ovr">${pos}</div>`;
                btn.onclick = () => {
                    const base = 80 + Math.floor(Math.random() * 15);
                    state.roster[i] = { pos, ovr: base };
                    modal.classList.remove('show');
                    renderBoard();
                };
                grid.appendChild(btn);
            }
        });

        modal.classList.add('show');
    }

    function simSeason() {
        state.hideOvr = false; // Reveal on sim
        renderBoard();
        
        const total = state.roster.reduce((a, b) => a + b.ovr, 0) / 6;
        const wins = Math.floor((total - 75) * 1.5);
        const finalWins = Math.max(0, Math.min(17, wins));
        
        document.getElementById('spin-label').innerHTML = `RECORD: ${finalWins}-${17-finalWins}`;
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function checkFull() {
        const full = state.roster.every(p => p !== null);
        document.getElementById('spin-btn').style.display = full ? 'none' : 'block';
        document.getElementById('sim-btn').style.display = full ? 'block' : 'none';
    }

    function switchView(view) {
        document.getElementById('view-draft').style.display = view === 'draft' ? 'block' : 'none';
        document.getElementById('view-settings').style.display = view === 'settings' ? 'block' : 'none';
        
        const tabs = document.querySelectorAll('.tab-item');
        tabs[0].classList.toggle('active', view === 'draft');
        tabs[1].classList.toggle('active', view === 'settings');
    }

    function toggleHide() { state.hideOvr = document.getElementById('check-hide').checked; renderBoard(); }
    function toggleTheme() { 
        const isLight = document.getElementById('check-theme').checked;
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
    }
    
    function resetAll() {
        state.roster = Array(6).fill(null);
        state.hideOvr = document.getElementById('check-hide').checked;
        document.getElementById('spin-label').innerText = "Ready?";
        document.getElementById('spin-logo').src = "https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png";
        renderBoard();
        switchView('draft');
    }
</script>
</body>
</html>

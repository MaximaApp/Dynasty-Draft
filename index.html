<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynasty Draft | 17-0 Builder</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --panel: #1c212c;
            --text: #f0f6fc;
            --text-dim: #8b949e;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --border: #30363d;
            --shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg: #f6f8fa;
            --card: #ffffff;
            --panel: #f1f5f9;
            --text: #1f2328;
            --text-dim: #636c76;
            --accent: #0969da;
            --accent-glow: rgba(9, 105, 218, 0.2);
            --border: #d0d7de;
            --shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; transition: 0.4s; }

        /* --- Landing Screen --- */
        #landing {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #landing.hidden { transform: translateY(-100%); }
        .hero-title { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 900; letter-spacing: -2px; background: linear-gradient(135deg, var(--text) 40%, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- Header --- */
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-box { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }

        .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .icon-btn:hover { border-color: var(--accent); transform: rotate(15deg); }

        /* --- Draft Zone --- */
        .draft-card { 
            background: var(--card); border-radius: 28px; padding: 30px; border: 1px solid var(--border); 
            box-shadow: var(--shadow); text-align: center; margin-bottom: 30px; position: relative;
        }
        .logo-stage { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        #display-logo { width: 130px; height: 130px; object-fit: contain; transition: 0.3s; }
        #display-logo.spinning { animation: spinPulse 0.15s infinite alternate; }
        #display-logo.glow { filter: drop-shadow(0 0 25px var(--accent-glow)); transform: scale(1.1); }

        .name-banner { font-size: 2rem; font-weight: 800; height: 2.5rem; margin-bottom: 10px; }
        .btn-main { 
            background: var(--accent); color: white; border: none; padding: 15px 40px; 
            border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1rem;
            box-shadow: 0 8px 20px var(--accent-glow); transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.95); }

        /* --- Roster Grid --- */
        .game-layout { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 850px) { .game-layout.dual { flex-direction: row; } .game-layout.dual > div { flex: 1; } }

        .roster-box { background: var(--card); border-radius: 24px; padding: 20px; border: 1px solid var(--border); }
        .roster-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .ovr-text { font-weight: 900; color: var(--accent); font-size: 1.2rem; }

        .slots-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
        .slot { 
            background: var(--panel); border-radius: 18px; padding: 12px; text-align: center;
            border: 2px solid transparent; cursor: pointer; min-height: 120px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .slot.active-target { border-color: var(--accent); animation: pulse 1.5s infinite; }
        .slot:hover { transform: translateY(-3px); background: var(--card); border-color: var(--border); }

        .slot-pos { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .slot-img { width: 45px; height: 45px; object-fit: contain; opacity: 0.1; margin-bottom: 5px; }
        .slot-img.filled { opacity: 1; filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .slot-name { font-size: 0.75rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        .slot-ovr { font-weight: 900; color: var(--accent); font-size: 0.85rem; }

        /* --- Settings & Simulation --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-ui { background: var(--card); border-radius: 24px; padding: 30px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .sim-area { margin-top: 40px; text-align: center; padding-bottom: 100px; }
        .sim-card { background: var(--card); border-radius: 30px; padding: 30px; display: inline-block; min-width: 300px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .record { font-size: 3.5rem; font-weight: 900; color: var(--accent); margin: 10px 0; }

        /* Fog of War Logic */
        .fog-active .slot-ovr, .fog-active .ovr-text { filter: blur(5px); pointer-events: none; }

        @keyframes spinPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-glow); } 70% { box-shadow: 0 0 0 10px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="landing">
        <h1 class="hero-title">Dynasty Draft</h1>
        <p style="color: var(--text-dim); margin-bottom: 25px;">The 17-0 Challenge</p>
        <button class="btn-main" onclick="document.getElementById('landing').classList.add('hidden')">PLAY NOW</button>
    </div>

    <div id="settings" class="modal">
        <div class="modal-ui">
            <h2 style="margin-bottom: 20px;">Draft Settings</h2>
            <div class="row"><span>Light Mode</span><input type="checkbox" id="t-theme" onchange="app.toggleTheme()"></div>
            <div class="row"><span>Hide Rankings</span><input type="checkbox" id="t-fog" onchange="app.toggleFog()"></div>
            <div class="row"><span>1v1 Mode</span><input type="checkbox" id="t-mode" onchange="app.toggleMode()"></div>
            <div class="row"><span>Include Coach</span><input type="checkbox" id="t-coach" onchange="app.refreshSlots()"></div>
            <div class="row"><span>Include O-Line</span><input type="checkbox" id="t-oline" onchange="app.refreshSlots()"></div>
            <button class="btn-main" style="width: 100%; margin-top: 10px;" onclick="document.getElementById('settings').style.display='none'">SAVE</button>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="logo-box">DYNASTY DRAFT</div>
            <button class="icon-btn" onclick="document.getElementById('settings').style.display='flex'">⚙️</button>
        </header>

        <section class="draft-card">
            <div class="logo-stage"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" id="display-logo"></div>
            <div class="name-banner" id="display-name">Generate Your Pick</div>
            <button class="btn-main" id="spin-btn" onclick="app.spin()">SPIN TEAM</button>
            <p id="tip" style="margin-top: 15px; font-weight: 700; color: var(--accent); min-height: 1.2rem;"></p>
        </section>

        <main class="game-layout" id="main-grid">
            <div class="roster-box">
                <div class="roster-info"><span>PLAYER 1</span><span class="ovr-text" id="p1-ovr">OVR: --</span></div>
                <div class="slots-grid" id="p1-slots"></div>
            </div>
            <div class="roster-box hidden" id="p2-card">
                <div class="roster-header roster-info"><span>PLAYER 2</span><span class="ovr-text" id="p2-ovr">OVR: --</span></div>
                <div class="slots-grid" id="p2-slots"></div>
            </div>
        </main>

        <section class="sim-area">
            <div class="sim-card">
                <h3 style="font-size: 0.8rem; letter-spacing: 2px; opacity: 0.6;">PREDICTED SEASON</h3>
                <div class="record" id="res-main">--</div>
                <div id="res-sub" style="color: var(--text-dim); margin-bottom: 20px;">Draft a full team to simulate</div>
                <button class="btn-main" onclick="app.simulate()">RUN ENGINE</button>
            </div>
        </section>
    </div>

    <script>
        const teams = [
            { id: 'bal', n: 'Ravens', o: 91 }, { id: 'kc', n: 'Chiefs', o: 95 }, { id: 'det', n: 'Lions', o: 92 },
            { id: 'sf', n: '49ers', o: 94 }, { id: 'phi', n: 'Eagles', o: 89 }, { id: 'buf', n: 'Bills', o: 88 },
            { id: 'hou', n: 'Texans', o: 87 }, { id: 'dal', n: 'Cowboys', o: 88 }, { id: 'gb', n: 'Packers', o: 86 },
            { id: 'nyj', n: 'Jets', o: 84 }, { id: 'chi', n: 'Bears', o: 83 }, { id: 'ari', n: 'Cardinals', o: 79 },
            { id: 'atl', n: 'Falcons', o: 82 }, { id: 'car', n: 'Panthers', o: 74 }, { id: 'cle', n: 'Browns', o: 85 },
            { id: 'pit', n: 'Steelers', o: 84 }, { id: 'cin', n: 'Bengals', o: 87 }, { id: 'sea', n: 'Seahawks', o: 81 },
            { id: 'was', n: 'Commanders', o: 83 }, { id: 'min', n: 'Vikings', o: 84 }, { id: 'mia', n: 'Dolphins', o: 85 }
        ];

        const app = {
            state: {
                theme: localStorage.getItem('dd_theme') || 'dark',
                mode: 'solo',
                p: 1,
                spinning: false,
                pick: null,
                rosters: { 1: {}, 2: {} }
            },

            init() {
                document.documentElement.setAttribute('data-theme', this.state.theme);
                document.getElementById('t-theme').checked = (this.state.theme === 'light');
                this.refreshSlots();
            },

            toggleTheme() {
                this.state.theme = document.getElementById('t-theme').checked ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', this.state.theme);
                localStorage.setItem('dd_theme', this.state.theme);
            },

            toggleFog() {
                document.getElementById('main-grid').classList.toggle('fog-active', document.getElementById('t-fog').checked);
            },

            toggleMode() {
                this.state.mode = document.getElementById('t-mode').checked ? '1v1' : 'solo';
                document.getElementById('p2-card').classList.toggle('hidden', this.state.mode === 'solo');
                document.getElementById('main-grid').classList.toggle('dual', this.state.mode === '1v1');
                this.reset();
            },

            refreshSlots() {
                const base = ['QB', 'RB', 'WR1', 'WR2', 'TE', 'DEF'];
                if (document.getElementById('t-coach').checked) base.push('COACH');
                if (document.getElementById('t-oline').checked) base.push('OLINE');
                this.state.currentSlots = base;

                [1, 2].forEach(num => {
                    const cont = document.getElementById(`p${num}-slots`);
                    cont.innerHTML = '';
                    base.forEach(pos => {
                        const div = document.createElement('div');
                        div.className = 'slot';
                        div.id = `slot-${num}-${pos}`;
                        div.onclick = () => this.assign(num, pos);
                        div.innerHTML = `<div class="slot-pos">${pos}</div><img src="https://a.espncdn.com/i/teamlogos/nfl/500/nfl.png" class="slot-img" id="img-${num}-${pos}"><div class="slot-name" id="name-${num}-${pos}">---</div><div class="slot-ovr" id="ovr-${num}-${pos}"></div>`;
                        cont.appendChild(div);
                    });
                });
                this.reset();
            },

            spin() {
                if (this.state.spinning || this.state.pick) return;
                this.state.spinning = true;
                const logo = document.getElementById('display-logo');
                const btn = document.getElementById('spin-btn');
                logo.className = 'spinning';
                btn.style.opacity = '0.5';

                let count = 0;
                let max = 30;
                const cycle = () => {
                    const t = teams[Math.floor(Math.random() * teams.length)];
                    logo.src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
                    document.getElementById('display-name').innerText = t.n;
                    count++;
                    if (count < max) {
                        setTimeout(cycle, count < max - 10 ? 60 : 60 + (count - 20) * 30);
                    } else {
                        this.state.pick = teams.find(x => x.n === document.getElementById('display-name').innerText);
                        this.state.spinning = false;
                        logo.className = 'glow';
                        btn.style.opacity = '1';
                        this.updateTips();
                    }
                };
                cycle();
            },

            updateTips() {
                const p = this.state.p;
                document.getElementById('tip').innerText = `PLACE IN PLAYER ${p} ROSTER`;
                this.state.currentSlots.forEach(s => {
                    if (!this.state.rosters[p][s]) document.getElementById(`slot-${p}-${s}`).classList.add('active-target');
                });
            },

            assign(pNum, pos) {
                if (!this.state.pick || pNum !== this.state.p || this.state.rosters[pNum][pos]) return;
                
                const t = this.state.pick;
                this.state.rosters[pNum][pos] = t.o;
                
                document.getElementById(`img-${pNum}-${pos}`).src = `https://a.espncdn.com/i/teamlogos/nfl/500/${t.id}.png`;
                document.getElementById(`img-${pNum}-${pos}`).classList.add('filled');
                document.getElementById(`name-${pNum}-${pos}`).innerText = t.n;
                document.getElementById(`ovr-${pNum}-${pos}`).innerText = t.o;

                this.state.pick = null;
                document.getElementById('display-logo').className = '';
                document.getElementById('tip').innerText = '';
                document.querySelectorAll('.slot').forEach(el => el.classList.remove('active-target'));
                
                this.calcOvr(pNum);
                if (this.state.mode === '1v1') this.state.p = (this.state.p === 1 ? 2 : 1);
            },

            calcOvr(pNum) {
                const vals = Object.values(this.state.rosters[pNum]);
                const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/this.state.currentSlots.length) : 0;
                document.getElementById(`p${pNum}-ovr`).innerText = `OVR: ${avg}`;
                this.state.rosters[pNum].avg = avg;
            },

            simulate() {
                if (Object.keys(this.state.rosters[1]).length < this.state.currentSlots.length) return alert("Finish drafting Player 1!");
                
                const res = document.getElementById('res-main');
                const sub = document.getElementById('res-sub');

                if (this.state.mode === 'solo') {
                    let w = 0;
                    const winProb = (this.state.rosters[1].avg - 65) / 40;
                    for(let i=0; i<17; i++) if (Math.random() < winProb) w++;
                    res.innerText = `${w}-${17-w}`;
                    sub.innerText = w === 17 ? "DYNASTY SECURED!" : "The journey continues.";
                } else {
                    if (Object.keys(this.state.rosters[2]).length < this.state.currentSlots.length) return alert("Finish drafting Player 2!");
                    const p1 = this.state.rosters[1].avg;
                    const p2 = this.state.rosters[2].avg;
                    const prob = Math.round(Math.min(Math.max(50 + (p1-p2)*5, 5), 95));
                    res.innerText = `${prob}%`;
                    sub.innerText = "Probability P1 wins the Duel";
                }
            },

            reset() {
                this.state.rosters = { 1: {}, 2: {} };
                this.state.p = 1;
                this.state.pick = null;
                document.getElementById('p1-ovr').innerText = "OVR: --";
                document.getElementById('p2-ovr').innerText = "OVR: --";
                document.getElementById('res-main').innerText = "--";
            }
        };

        app.init();
    </script>
</body>
</html>

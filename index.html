        { name: "San Francisco 49ers", logo: "[https://static.www.nfl.com/image/private/f_auto/league/31445_50](https://static.www.nfl.com/image/private/f_auto/league/31445_50)", rating: 92 },
        { name: "Seattle Seahawks", logo: "[https://static.www.nfl.com/image/private/f_auto/league/31445_51](https://static.www.nfl.com/image/private/f_auto/league/31445_51)", rating: 81 },
        { name: "Tampa Bay Buccaneers", logo: "[https://static.www.nfl.com/image/private/f_auto/league/31445_52](https://static.www.nfl.com/image/private/f_auto/league/31445_52)", rating: 82 },
        { name: "Tennessee Titans", logo: "[https://static.www.nfl.com/image/private/f_auto/league/31445_53](https://static.www.nfl.com/image/private/f_auto/league/31445_53)", rating: 73 },
        { name: "Washington Commanders", logo: "[https://static.www.nfl.com/image/private/f_auto/league/p57p4686u7s978p3p9v9](https://static.www.nfl.com/image/private/f_auto/league/p57p4686u7s978p3p9v9)", logo: "[https://static.www.nfl.com/image/private/f_auto/league/54-commanders-new](https://static.www.nfl.com/image/private/f_auto/league/54-commanders-new)", rating: 75 }

    const rosterSlots = [
        { id: 'qb', label: 'Quarterback', emoji: '🎯' },
        { id: 'wr1', label: 'Wide Receiver 1', emoji: '🏃' },
        { id: 'wr2', label: 'Wide Receiver 2', emoji: '🏃' },
        { id: 'te', label: 'Tight End', emoji: '🛡️' },
        { id: 'rb', label: 'Running Back', emoji: '💨' },
        { id: 'def', label: 'Defense/ST', emoji: '🚧' }
    ];

    /** STATE MANAGEMENT **/
    let appMode = 'solo'; 
    let currentTurn = 1;
    let p1Team = null;
    let p2Team = null;
    let rosters = { p1: {}, p2: {} };

    /** INITIALIZATION **/
    function initApp(mode) {
        appMode = mode;
        document.getElementById('modeSelection').classList.add('hidden');
        const genSection = document.getElementById('generatorSection');
        genSection.classList.remove('hidden-section');
        genSection.classList.add('visible-section');
        
        if (mode === 'solo') {
            document.getElementById('turnIndicator').innerText = "Spin for your Team";
        } else {
            document.getElementById('roster2').classList.remove('hidden');
        }
    }

    /** THEME TOGGLE **/
    document.getElementById('modeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
    });

    /** SLOT MACHINE LOGIC **/
    const spinBtn = document.getElementById('spinBtn');
    const activeLogo = document.getElementById('activeLogo');
    const activeTeamName = document.getElementById('activeTeamName');
    const glowRing = document.getElementById('glowRing');

    spinBtn.addEventListener('click', () => {
        spinBtn.disabled = true;
        spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        let duration = 3000;
        let startTime = null;
        let speed = 50;

        const animate = (timestamp) => {
            if (!startTime) startTime = timestamp;
            let progress = timestamp - startTime;

            // Cycle teams
            const randomIndex = Math.floor(Math.random() * nflTeams.length);
            activeLogo.src = nflTeams[randomIndex].logo;
            activeTeamName.innerText = nflTeams[randomIndex].name;

            if (progress < duration) {
                // Gradual slowdown effect
                let remaining = duration - progress;
                let delay = Math.max(50, 300 - (remaining / 10));
                setTimeout(() => requestAnimationFrame(animate), delay);
            } else {
                finalizeSelection(nflTeams[randomIndex]);
            }
        };

        requestAnimationFrame(animate);
    });

    function finalizeSelection(team) {
        // Glow Effect
        glowRing.style.borderColor = "#3b82f6";
        glowRing.classList.add('team-glow');
        activeLogo.classList.add('scale-125');
        
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
        });

        setTimeout(() => {
            if (appMode === '1v1' && currentTurn === 1) {
                p1Team = team;
                currentTurn = 2;
                resetForNextPlayer();
            } else if (appMode === '1v1' && currentTurn === 2) {
                p2Team = team;
                transitionToBuilder();
            } else {
                p1Team = team;
                transitionToBuilder();
            }
        }, 1500);
    }

    function resetForNextPlayer() {
        glowRing.classList.remove('team-glow');
        activeLogo.classList.remove('scale-125');
        glowRing.style.borderColor = "transparent";
        document.getElementById('turnIndicator').innerText = "Player 2: Spin for your Team";
        document.getElementById('turnIndicator').classList.replace('text-blue-500', 'text-red-500');
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        activeTeamName.innerText = "Waiting...";
        activeLogo.src = "[https://static.www.nfl.com/image/upload/v1554321393/league/nv9id998ib57dfocxfmo.svg](https://static.www.nfl.com/image/upload/v1554321393/league/nv9id998ib57dfocxfmo.svg)";
    }

    /** BUILDER LOGIC **/
    function transitionToBuilder() {
        document.getElementById('generatorSection').classList.add('hidden');
        const builder = document.getElementById('builderSection');
        builder.classList.remove('hidden-section');
        builder.classList.add('visible-section');

        // Setup UI
        document.getElementById('p1FinalLogo').src = p1Team.logo;
        document.getElementById('p1FinalName').innerText = p1Team.name;
        setupSlots('slotsP1', 'p1');

        if (appMode === '1v1') {
            document.getElementById('p2FinalLogo').src = p2Team.logo;
            document.getElementById('p2FinalName').innerText = p2Team.name;
            setupSlots('slotsP2', 'p2');
        }
    }

    function setupSlots(containerId, playerKey) {
        const container = document.getElementById(containerId);
        rosterSlots.forEach(slot => {
            const div = document.createElement('div');
            div.className = "p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 card-hover flex flex-col items-center justify-center space-y-2 cursor-pointer";
            div.innerHTML = `
                <span class="text-2xl">${slot.emoji}</span>
                <span class="text-xs font-bold uppercase text-slate-500">${slot.label}</span>
                <select onchange="updateState('${playerKey}', '${slot.id}', this.value)" class="bg-transparent border-none text-center font-bold w-full focus:ring-0">
                    <option value="0">Select Talent</option>
                    <option value="95">All-Pro (95)</option>
                    <option value="85">Starter (85)</option>
                    <option value="75">Rookie (75)</option>
                    <option value="60">Backup (60)</option>
                </select>
            `;
            container.appendChild(div);
        });
    }

    function updateState(player, slot, val) {
        rosters[player][slot] = parseInt(val);
    }

    /** SIMULATION ENGINE **/
    document.getElementById('simulateBtn').addEventListener('click', () => {
        const getScore = (player) => {
            let base = player === 'p1' ? p1Team.rating : (p2Team ? p2Team.rating : 50);
            let rosterSum = Object.values(rosters[player]).reduce((a, b) => a + b, 0);
            let count = Object.values(rosters[player]).length || 1;
            
            // Extra modifiers
            if(document.getElementById('toggleCoach').checked) base += 5;
            if(document.getElementById('toggleOLine').checked) base += 3;

            return (base * 0.4) + ((rosterSum / count) * 0.6) + (Math.random() * 10);
        };

        const score1 = getScore('p1');
        const score2 = appMode === '1v1' ? getScore('p2') : (75 + Math.random() * 20); // CPU is average-strong

        const total = score1 + score2;
        const prob1 = Math.round((score1 / total) * 100);
        
        showResults(prob1, score1 > score2);
    });

    function showResults(prob, p1Wins) {
        const modal = document.getElementById('resultModal');
        const winnerName = document.getElementById('winnerName');
        const probBar = document.getElementById('winProbBar');
        const probText = document.getElementById('winProbText');
        const confText = document.getElementById('confidenceLevel');

        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.add('opacity-100'), 10);

        let displayProb = p1Wins ? prob : (100 - prob);
        let winner = p1Wins ? p1Team.name : (appMode === '1v1' ? p2Team.name : "CPU Rival");

        winnerName.innerText = winner + " WINS!";
        probText.innerText = displayProb + "%";
        probBar.style.width = displayProb + "%";
        probBar.className = p1Wins ? "h-full bg-blue-500" : "h-full bg-red-500";

        if (displayProb > 80) confText.innerText = "Confidence: Absolute Dominance";
        else if (displayProb > 60) confText.innerText = "Confidence: Comfortable Lead";
        else confText.innerText = "Confidence: Gritty Victory";

        if(p1Wins) {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.7 } });
        }
    }

    function closeModal() {
        const modal = document.getElementById('resultModal');
        modal.classList.remove('opacity-100');
        setTimeout(() => modal.classList.add('hidden'), 500);
    }
</script>
